<script>
  var searchBtn = document.getElementById('searchBtn');
  var searchTop = document.getElementById('searchTop');
  var searchInput = document.getElementById('searchInput');
  searchBtn.addEventListener('click', function(){
    var open = searchTop.classList.toggle('open');
    searchBtn.classList.toggle('on', open);
    if (open) { setTimeout(function(){ searchInput.focus(); }, 80); }
    else { searchInput.blur(); }
  });

  // 작물 카테고리 선택
  document.querySelectorAll('.crop').forEach(function(c){
    c.addEventListener('click', function(){
      document.querySelectorAll('.crop').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
    });
  });
</script>
