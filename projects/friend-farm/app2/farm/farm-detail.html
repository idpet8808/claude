<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 농장 정보 조회</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/farm-detail.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol><symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="i-check-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../farm/farmlist.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">농장 정보 조회</span><button class="more" id="moreBtn" aria-label="더보기"><svg class="ic"><use href="#i-more"/></svg></button></div>
<div class="scroll">
      <!-- 농장 제목 -->
      <div class="farm-head">
        <span class="fh-badge">대표농장</span>
        <h1 class="fh-name">강남 역삼 농원</h1>
      </div>

      <!-- 사진 스와이프 -->
      <div class="gallery">
        <div class="track" id="track">
          <div class="slide"><img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
          <div class="slide"><img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
          <div class="slide"><img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
        </div>
        <span class="counter" id="counter">1 / 3</span>
        <div class="dots" id="dots">
          <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <!-- 농장 정보 -->
      <div class="sec">
        <div class="info-row">
          <span class="k">농장위치</span>
          <span class="v loc"><svg class="ic"><use href="#i-pin"/></svg> 서울특별시 종로구</span>
        </div>
        <div class="info-row">
          <span class="k">재배방법</span>
          <span class="v">토경재배</span>
        </div>
        <div class="info-row">
          <span class="k">재배면적</span>
          <span class="v">1,200 ㎡ <span class="sub">· 363 평</span></span>
        </div>
      </div>

      <!-- 재배작물 -->
      <div class="sec-title-out">재배작물 2종</div>
      <div class="crop-list">
        <div class="crop-item">
          <span class="ci-dot"></span>
          <span class="ci-name">오이 (백다다기)</span>
          <span class="rep-mini">대표</span>
          <span class="ci-meta">500주</span>
        </div>
        <div class="crop-item">
          <span class="ci-dot"></span>
          <span class="ci-name">딸기</span>
        </div>
      </div>
    </div>

    <!-- 더보기 액션 시트 -->
    <div class="sheet-scrim" id="actionSheet">
      <div class="action-sheet">
        <div class="as-group">
          <button class="as-item" id="asEdit">농장 수정</button>
          <button class="as-item del" id="asDelete">농장 삭제</button>
        </div>
        <button class="as-cancel" id="asCancel">취소</button>
      </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal-scrim" id="confirmModal">
      <div class="modal">
        <div class="modal-title">농장을 삭제할까요?</div>
        <div class="modal-desc">삭제하면 농장 정보와 작성한<br>일지를 되돌릴 수 없어요.</div>
        <div class="modal-actions">
          <button class="mbtn-ghost" id="confirmCancel">취소</button>
          <button class="mbtn-danger" id="confirmDelete">삭제</button>
        </div>
      </div>
    </div>

    <!-- 삭제 완료 모달 -->
    <div class="modal-scrim" id="deletedModal">
      <div class="modal">
        <div class="modal-ic"><svg class="ic"><use href="#i-check-c"/></svg></div>
        <div class="modal-title">농장 정보 삭제 완료</div>
        <div class="modal-desc">농장 정보를 삭제했어요.</div>
        <button class="modal-btn" id="deletedOk">확인</button>
      </div>
    </div>
<script src="../js/farm-detail.js"></script>

  </div>

</body>
</html>
