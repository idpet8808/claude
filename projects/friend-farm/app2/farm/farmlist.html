<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 농장 정보 조회</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/farmlist.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol><symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol><symbol id="i-leaf-f" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/></symbol><symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../home.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">농장 정보 조회</span><a class="menu" href="../menu.html" aria-label="메뉴"><svg class="ic"><use href="#i-menu"/></svg></a></div>
<div class="scroll">
      <div class="count-row">
        <span class="t">내 농장</span>
        <span class="n">2곳 등록 · 최대 10곳</span>
      </div>

      <div class="farm-list">
        <!-- 대표 농장 (사진 있음) -->
        <a class="farm" href="farm-detail.html">
          <div class="f-thumb">
            <img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?w=300&q=80" alt="농장 사진" onerror="this.parentElement.classList.add('empty');this.remove();"/>
          </div>
          <div class="f-main">
            <div class="f-top"><span class="f-name">강남 역삼 농원</span><span class="f-badge">대표</span></div>
            <div class="f-sub">서울특별시 종로구 · 오이 (백다다기) · 토경재배</div>
          </div>
          <svg class="ic f-cv"><use href="#i-cv"/></svg>
        </a>

        <!-- 일반 농장 (사진 없음) -->
        <a class="farm" href="farm-detail.html">
          <div class="f-thumb empty"><span class="leaf-bg"><svg viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg></span><svg class="ic"><use href="#i-leaf"/></svg></div>
          <div class="f-main">
            <div class="f-top"><span class="f-name">양평 비닐하우스</span></div>
            <div class="f-sub">경기도 양평군 · 토마토 (대저) · 수경재배</div>
          </div>
          <svg class="ic f-cv"><use href="#i-cv"/></svg>
        </a>
      </div>
    </div>

    <a class="fab" href="farm-register.html" style="text-decoration:none;"><svg class="ic"><use href="#i-plus"/></svg> 농장 등록</a>

  </div>

</body>
</html>
