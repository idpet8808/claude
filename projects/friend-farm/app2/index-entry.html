<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>농사친구 로그인 진입</title>
<link rel="stylesheet" href="css/common.css"/>
<link rel="stylesheet" href="css/components.css"/>
<style>
:root { --line: rgba(48, 42, 30, .11); }
body {
  background: #DADDD5;
  display: flex;
  justify-content: center;
  padding: 24px 0 40px;
}
.phone {
  height: 844px;
  min-height: 0;
  position: relative;
  background: #F6F7F3;
}
.phone::before,
.phone::after {
  content: "";
  position: absolute;
  width: 210px;
  height: 210px;
  border-radius: 58% 42% 55% 45%;
  background: rgba(27, 126, 25, .035);
  pointer-events: none;
}
.phone::before {
  top: -46px;
  right: -88px;
  transform: rotate(32deg);
}
.phone::after {
  left: -118px;
  bottom: 190px;
  transform: rotate(-28deg);
}
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-size: 13px;
  font-weight: 900;
  position: relative;
  z-index: 1;
}
.status-bar .group {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.status-bar .ic { font-size: 15px; }
.entry {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 23px 28px;
}
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-bottom: 14px;
}
.app-icon {
  width: 88px;
  height: 88px;
  border-radius: 22px;
  overflow: hidden;
  background: #21AF1D;
  border: 1px solid rgba(255,255,255,.42);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .24),
    0 18px 30px -20px rgba(21, 116, 18, .82);
}
.app-icon img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.title {
  margin-top: 30px;
  font-size: 28px;
  line-height: 1.28;
  font-weight: 900;
  letter-spacing: -0.024em;
  color: #101312;
}
.title b {
  color: #10920D;
  font-weight: 900;
}
.desc {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.68;
  color: #5D625C;
  font-weight: 650;
}
.auth {
  flex-shrink: 0;
}
.login-btn {
  width: 100%;
  height: 54px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.012em;
}
.login-btn .bi {
  position: absolute;
  left: 18px;
  display: grid;
  place-items: center;
}
.login-btn .ic { font-size: 18px; }
.login-btn.email {
  position: relative;
  color: #fff;
  background: linear-gradient(180deg, #27BB22 0%, #20AA1D 52%, #148F12 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 12px 20px -16px rgba(16,112,15,.78);
}
.login-btn.kakao {
  position: relative;
  margin-top: 10px;
  color: #111;
  background: #FFE100;
  box-shadow: 0 8px 18px -16px rgba(80,72,0,.5);
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 17px 0 16px;
  color: var(--gray);
  font-size: 12px;
  font-weight: 700;
}
.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.social {
  display: flex;
  justify-content: center;
  gap: 18px;
}
.social-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.86);
  border: 1px solid rgba(48, 42, 30, .09);
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.social-btn .ic { font-size: 23px; }
.social-btn.naver { background: #03C75A; color: #fff; border-color: transparent; }
.social-btn.apple { background: #111; color: #fff; border-color: transparent; }
.foot {
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  text-align: center;
  color: #7C8179;
  font-size: 13px;
  font-weight: 600;
}
.foot a {
  color: #128F11;
  font-weight: 900;
  text-decoration: underline;
  text-underline-offset: 2px;
}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7-.2.7-.7 2.5-.8 2.9 0 .2.1.4.4.2.3-.2 3-2 4.2-2.8.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></symbol>
    <symbol id="i-naver" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h4.6l4.8 7.2V4H19v16h-4.6L9.6 12.8V20H5z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12.5c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7s2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.8 5.2c.6-.8 1-1.9.9-3-1 0-2.1.7-2.8 1.5-.6.7-1.1 1.8-.9 2.8 1.1.1 2.2-.5 2.8-1.3z"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.6-.1-1.3-.2-1.9H12v3.6h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6C4.7 19.9 8.1 22 12 22z"/><path fill="#FBBC05" d="M6.4 13.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.3H3.1C2.4 8.7 2 10.3 2 12s.4 3.3 1.1 4.7l3.3-2.6z"/><path fill="#EA4335" d="M12 6.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.5 14.7 2.6 12 2.6 8.1 2.6 4.7 4.7 3.1 7.9l3.3 2.6C7.2 8.1 9.4 6.4 12 6.4z"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg><svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <main class="entry">
      <section class="hero">
        <div class="app-icon"><img src="img/friend-logo.png" alt="농사친구 로고"></div>
        <h1 class="title">농사를 더 쉽게,<br><b>더 똑똑하게</b></h1>
        <p class="desc">일지 작성, 작물 정보, 대화형 AI까지<br>하나로 관리해 보세요</p>
      </section>

      <section class="auth">
        <a class="login-btn email" href="auth/signup-terms.html"><span class="bi"><svg class="ic"><use href="#i-mail"/></svg></span>이메일로 시작하기</a>
        <button class="login-btn kakao"><span class="bi"><svg class="ic"><use href="#i-chat"/></svg></span>카카오로 시작하기</button>

        <div class="divider">간편 로그인</div>
        <div class="social">
          <button class="social-btn naver" aria-label="네이버로 시작"><svg class="ic"><use href="#i-naver"/></svg></button>
          <button class="social-btn apple" aria-label="Apple로 시작"><svg class="ic"><use href="#i-apple"/></svg></button>
          <button class="social-btn" aria-label="Google로 시작"><svg class="ic"><use href="#i-google"/></svg></button>
        </div>

        <div class="foot">이미 계정이 있으신가요? <a href="auth/login.html">로그인</a></div>
      </section>
    </main>
  </div>
</body>
</html>
