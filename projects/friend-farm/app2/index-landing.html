<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>농사친구 랜딩 시안</title>
<link rel="stylesheet" href="css/common.css"/>
<link rel="stylesheet" href="css/components.css"/>
<style>
:root { --line: rgba(255,255,255,.18); }
body {
  background: #E8E6DF;
  display: flex;
  justify-content: center;
  padding: 24px 0 40px;
}
.phone {
  height: 844px;
  min-height: 0;
  position: relative;
  background: #F4F5F2;
}
.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.landing-hero {
  min-height: 690px;
  position: relative;
  display: flex;
  flex-direction: column;
  color: #fff;
  background:
    linear-gradient(180deg, rgba(10,22,12,.35) 0%, rgba(10,22,12,.18) 30%, rgba(10,22,12,.78) 100%),
    linear-gradient(90deg, rgba(8,24,12,.68) 0%, rgba(8,24,12,.18) 74%),
    url("img/home-hero-bg.jpg") center / cover no-repeat;
}
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-size: 13px;
  font-weight: 800;
  color: rgba(255,255,255,.95);
}
.status-bar .group { display: inline-flex; gap: 6px; align-items: center; }
.status-bar .ic { font-size: 15px; }
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.016em;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(6px);
}
.brand-mark .ic { font-size: 17px; }
.login-link {
  font-size: 12px;
  font-weight: 900;
  color: rgba(255,255,255,.86);
}
.hero-copy {
  margin-top: auto;
  padding: 0 24px 32px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 900;
  color: rgba(255,255,255,.92);
  margin-bottom: 14px;
}
.eyebrow::before {
  content: "";
  width: 24px;
  height: 2px;
  border-radius: 2px;
  background: #7FE36F;
}
.hero-copy h1 {
  font-size: 44px;
  line-height: .98;
  font-weight: 900;
  letter-spacing: 0;
}
.hero-copy p {
  margin-top: 16px;
  font-size: 15px;
  line-height: 1.58;
  font-weight: 650;
  color: rgba(255,255,255,.88);
  max-width: 315px;
}
.hero-actions {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  margin-top: 24px;
}
.primary {
  height: 56px;
  border-radius: 15px;
  background: #fff;
  color: var(--green-2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: -0.012em;
}
.ghost {
  height: 56px;
  padding: 0 17px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.26);
  color: #fff;
  font-size: 13px;
  font-weight: 900;
  backdrop-filter: blur(8px);
}
.below {
  padding: 22px 24px 34px;
  background: #F4F5F2;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-head h2 {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.02em;
}
.section-head span {
  font-size: 11px;
  color: var(--gray);
  font-weight: 900;
}
.flow {
  border-top: 1px solid rgba(48,42,30,.10);
  border-bottom: 1px solid rgba(48,42,30,.10);
}
.flow-row {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 16px 0;
}
.flow-row + .flow-row { border-top: 1px solid rgba(48,42,30,.08); }
.num {
  font-size: 12px;
  font-weight: 900;
  color: var(--green-2);
}
.flow-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.012em;
}
.flow-desc {
  margin-top: 3px;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
}
.tag {
  font-size: 10.5px;
  font-weight: 900;
  color: var(--green-2);
  white-space: nowrap;
}
.proof {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid rgba(48,42,30,.10);
  border-bottom: 1px solid rgba(48,42,30,.10);
}
.proof div {
  padding: 14px 9px 13px 0;
}
.proof div + div {
  border-left: 1px solid rgba(48,42,30,.10);
  padding-left: 11px;
}
.proof strong {
  display: block;
  font-size: 18px;
  font-weight: 900;
  color: var(--ink);
}
.proof span {
  display: block;
  margin-top: 4px;
  font-size: 10.5px;
  line-height: 1.35;
  color: var(--gray);
  font-weight: 800;
}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="scroll">
      <section class="landing-hero">
        <div class="status-bar">
          <span>9:41</span>
          <span class="group"><svg class="ic"><use href="#i-wifi"/></svg><svg class="ic"><use href="#i-battery"/></svg></span>
        </div>
        <div class="topline">
          <div class="brand"><span class="brand-mark"><svg class="ic"><use href="#i-leaf"/></svg></span>농사친구</div>
          <a class="login-link" href="auth/login.html">로그인</a>
        </div>
        <div class="hero-copy">
          <div class="eyebrow">AI 농장 관리 플랫폼</div>
          <h1>농사친구</h1>
          <p>작물 질문부터 병해진단, 영농 기록까지 농장 관리의 복잡한 순간을 하나의 흐름으로 정리합니다.</p>
          <div class="hero-actions">
            <a class="primary" href="auth/signup-terms.html">무료로 시작하기 <svg class="ic"><use href="#i-arrow"/></svg></a>
            <a class="ghost" href="home.html">둘러보기</a>
          </div>
        </div>
      </section>

      <section class="below">
        <div class="section-head">
          <h2>농장 관리 흐름</h2>
          <span>QUESTION TO RECORD</span>
        </div>
        <div class="flow">
          <div class="flow-row">
            <span class="num">01</span>
            <div><div class="flow-title">궁금한 점을 바로 질문</div><div class="flow-desc">재배, 병해충, 시설 관리까지 맥락에 맞게 정리</div></div>
            <span class="tag">AI 상담</span>
          </div>
          <div class="flow-row">
            <span class="num">02</span>
            <div><div class="flow-title">사진으로 상태 확인</div><div class="flow-desc">작물 이상 징후를 빠르게 점검하고 다음 행동 연결</div></div>
            <span class="tag">진단</span>
          </div>
          <div class="flow-row">
            <span class="num">03</span>
            <div><div class="flow-title">기록으로 관리 누적</div><div class="flow-desc">영농일지, 시세, 맞춤 정보를 한 화면에서 관리</div></div>
            <span class="tag">기록</span>
          </div>
        </div>
        <div class="proof">
          <div><strong>24h</strong><span>언제든 질문</span></div>
          <div><strong>3초</strong><span>사진 진입</span></div>
          <div><strong>1곳</strong><span>정보 관리</span></div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
