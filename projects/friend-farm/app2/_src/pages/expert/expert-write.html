<!--META {"title":"질문하기","back":"expert/expert-list.html","menu":true,"css":"expert-write.css"} -->
<div class="scroll">
      <div class="field">
        <label class="lab">분야 선택</label>
        <div class="chips">
          <button class="chip on">스마트팜</button>
          <button class="chip">가공</button>
          <button class="chip">유통</button>
          <button class="chip">운영</button>
          <button class="chip">기타</button>
        </div>
      </div>

      <div class="field" id="field-title">
        <label class="lab" for="q-title">제목</label>
        <div class="box"><input class="inp" id="q-title" type="text" placeholder="질문 제목을 입력해 주세요" /></div>
        <p class="err-msg">제목을 입력해 주세요.</p>
      </div>

      <div class="field" id="field-body">
        <label class="lab" for="q-body">질문 내용</label>
        <div class="area"><textarea id="q-body" placeholder="구체적인 상황을 적어주시면 더 정확한 답변을 받을 수 있어요." maxlength="1000"></textarea></div>
        <div class="count">0 / 1000</div>
        <p class="err-msg">질문 내용을 10자 이상 입력해 주세요.</p>
      </div>

      <div class="field">
        <label class="lab">사진 첨부 <span style="color:var(--gray);font-weight:600">(선택, 최대 3장)</span></label>
        <div class="photos"><button class="photo-add"><svg class="ic"><use href="#i-cam"/></svg><span class="n">0/3</span></button></div>
      </div>
    </div>

    <div class="foot"><button class="btn-submit" id="btnSubmit">질문 등록</button></div>

    <div class="scrim" id="doneDialog">
      <div class="dialog">
        <div class="dlg-ic"><svg class="ic"><use href="#i-check"/></svg></div>
        <div class="dlg-title">질문이 등록되었어요</div>
        <div class="dlg-desc">분야별 전문가가 확인 후 답변드릴게요.</div>
        <button class="dlg-btn" id="doneOk">확인</button>
      </div>
    </div>
<script>
    document.querySelectorAll('.chip').forEach(function(c){ c.addEventListener('click', function(){ document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); }); c.classList.add('on'); }); });
    var ta = document.getElementById('q-body'), cnt = document.querySelector('.count');
    if (ta && cnt) ta.addEventListener('input', function(){ cnt.textContent = ta.value.length + ' / 1000'; });
    var iTitle = document.getElementById('q-title'), fTitle = document.getElementById('field-title'), fBody = document.getElementById('field-body'), dialog = document.getElementById('doneDialog');
    function setErr(field, box, on){ field.classList.toggle('show-err', on); box.classList.toggle('err', on); }
    document.getElementById('btnSubmit').addEventListener('click', function(){
      var okTitle = iTitle.value.trim().length > 0, okBody = ta.value.trim().length >= 10;
      setErr(fTitle, fTitle.querySelector('.box'), !okTitle);
      setErr(fBody, fBody.querySelector('.area'), !okBody);
      if (okTitle && okBody) dialog.classList.add('show');
    });
    iTitle.addEventListener('input', function(){ if (fTitle.classList.contains('show-err')) setErr(fTitle, fTitle.querySelector('.box'), false); });
    ta.addEventListener('input', function(){ if (fBody.classList.contains('show-err')) setErr(fBody, fBody.querySelector('.area'), false); });
    document.getElementById('doneOk').addEventListener('click', function(){ dialog.classList.remove('show'); window.location.href = 'expert-list.html'; });
  </script>
