<script>
    // 2026년 5월: 1일=금요일(요일 index 5), 31일까지
    var year = 2026, month = 5;
    var firstDow = 5; // 금
    var daysInMonth = 31;
    var today = 27;
    var selected = 27;
    var hasLog = { 3:1, 8:1, 12:1, 19:1, 20:1, 24:1, 27:1 }; // 일지 있는 날

    function buildGrid(){
      var grid = document.getElementById('grid');
      var html = '';
      for (var i = 0; i < firstDow; i++) html += '<div class="day empty"></div>';
      for (var d = 1; d <= daysInMonth; d++){
        var dow = (firstDow + d - 1) % 7;
        var cls = 'day';
        if (dow === 0) cls += ' sun';
        if (d === today) cls += ' today';
        if (d === selected) cls += ' on';
        html += '<button class="'+cls+'" data-d="'+d+'">'+d
          + (hasLog[d] ? '<span class="dot"></span>' : '<span style="width:5px;height:5px"></span>')
          + '</button>';
      }
      grid.innerHTML = html;
      grid.querySelectorAll('.day[data-d]').forEach(function(b){
        b.addEventListener('click', function(){
          selected = parseInt(b.dataset.d);
          buildGrid();
        });
      });
    }
    buildGrid();
  </script>
