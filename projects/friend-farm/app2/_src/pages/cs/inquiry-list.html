<script>
    var chips = document.querySelectorAll('.f-chip'), cards = document.querySelectorAll('.card');
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        chips.forEach(function(c){ c.classList.remove('on'); });
        chip.classList.add('on');
        var f = chip.getAttribute('data-filter');
        cards.forEach(function(card){ var st = card.getAttribute('data-status'); card.style.display = (f === 'all' || f === st) ? '' : 'none'; });
      });
    });
  </script>
