<!--META {"layout":"raw"} -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 추가 질문</title>
<link rel="stylesheet" href="{{A}}css/common.css"/>
<link rel="stylesheet" href="{{A}}css/components.css"/>
<link rel="stylesheet" href="{{A}}css/diagnose-followup.css"/>
</head>
<body>
  {{SPRITE}}

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">추가 질문</span>
      <a class="menu" href="../menu.html" aria-label="메뉴"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></a>
    </div>

    <div class="qprog">
      <div class="qpinfo">
        <span class="qplabel">정확한 진단을 위해</span>
        <span class="qpcount"><b id="curQ">2</b> / <span id="totalQ">5</span></span>
      </div>
      <div class="qpbar"><div class="qpfill" id="qpfill"></div></div>
    </div>

    <div class="scroll">
      <div class="ai-intro">
        <div class="av"><svg class="ic"><use href="#i-bot"/></svg></div>
        <div class="at">
          <b>AI가 추가로 확인 중이에요</b>
          <p>몇 가지만 더 알려주면 더 정확하게 진단해드릴 수 있어요</p>
        </div>
      </div>

      <h2 class="bigq">반점에 둥근<br>테두리(링)가 보이나요?</h2>
      <p class="bigsub">잎의 반점을 자세히 살펴보고 답해주세요</p>

      <div class="yesno" id="yesnoAns">
        <button class="ans on" data-v="예">
          예, 보여요
          <span class="arrow"><svg class="ic"><use href="#i-check"/></svg></span>
        </button>
        <button class="ans" data-v="아니오">
          아니요, 안 보여요
          <span class="arrow"><svg class="ic"><use href="#i-next"/></svg></span>
        </button>
      </div>
    </div>

    <div class="footer">
      <button class="btn btn-ghost" id="prevBtn">이전</button>
      <button class="btn btn-next" id="nextBtn">다음 <svg class="ic"><use href="#i-next"/></svg></button>
    </div>
  </div>

  <script>
    var cur = 2, total = 5;
    var curEl = document.getElementById('curQ');
    var totalEl = document.getElementById('totalQ');
    var fill = document.getElementById('qpfill');
    function renderProg(){
      curEl.textContent = cur;
      totalEl.textContent = total;
      fill.style.transform = 'scaleX(' + (cur/total) + ')';
    }
    renderProg();

    document.querySelectorAll('#yesnoAns .ans').forEach(function(a){
      a.addEventListener('click', function(){
        document.querySelectorAll('#yesnoAns .ans').forEach(function(x){
          x.classList.remove('on');
          var arrow = x.querySelector('.arrow use');
          if (arrow) arrow.setAttribute('href', '#i-next');
        });
        a.classList.add('on');
        var arrow = a.querySelector('.arrow use');
        if (arrow) arrow.setAttribute('href', '#i-check');
      });
    });

    // 데모 네비게이션 (input → loading → followup → result)
    document.getElementById('prevBtn').addEventListener('click', function(){ location.href = 'diagnose-input.html'; });
    document.getElementById('nextBtn').addEventListener('click', function(){ location.href = 'diagnose-result.html'; });
    var backBtn = document.querySelector('.appbar .back');
    if (backBtn) backBtn.addEventListener('click', function(){ location.href = 'diagnose-input.html'; });
  </script>
</body>
</html>
