<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — AI 진단 중</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/diagnose-loading.css"/>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-batt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/></symbol><symbol id="i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol></defs></svg>


  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-batt"/></svg></span>
    </div>

    <div class="content">
      <div class="scan-ring">
        <div class="scan-orbit"><span class="dot"></span></div>
        <div class="scan-core"><svg class="ic"><use href="#i-scan"/></svg></div>
      </div>
      <h1>AI가 진단 중이에요</h1>
      <p class="sub">잠시만 기다려주세요<br>증상을 분석하고 있어요</p>
      <div class="steps">
        <div class="stp done"><span class="sdot"><svg class="ic"><use href="#i-check"/></svg></span><span class="stext">작물 정보 확인</span></div>
        <div class="stp done"><span class="sdot"><svg class="ic"><use href="#i-check"/></svg></span><span class="stext">증상·부위 분석</span></div>
        <div class="stp on"><span class="sdot"><span class="spinner"></span></span><span class="stext">사진 영상 분석</span></div>
      </div>
    </div>

    <div class="skip-bar">
      <span class="skip">평균 5~10초 정도 걸려요</span>
    </div>
  </div>

  <script>
    // 데모 흐름: 분석 완료 후 결과 화면으로 자동 이동
    setTimeout(function(){ location.href = 'diagnose-result.html'; }, 2800);
  </script>
</body>
</html>
