<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>농사친구 시작 화면 시안</title>
<link rel="stylesheet" href="css/common.css"/>
<link rel="stylesheet" href="css/components.css"/>
<style>
:root { --line: rgba(31, 38, 28, .11); }
body {
  background: #E8E6DF;
  display: flex;
  justify-content: center;
  padding: 24px 0 40px;
}
.phone {
  min-height: 844px;
  position: relative;
  background:
    linear-gradient(180deg, #F7F8F4 0%, #F4F5F2 44%, #ECEFE8 100%);
}
.status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-size: 13px;
  font-weight: 800;
}
.status-bar .group { display: inline-flex; gap: 6px; align-items: center; }
.status-bar .ic { font-size: 15px; }
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px 24px 28px;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 58px;
}
.brand-name {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.018em;
}
.brand-mark {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  overflow: hidden;
  border-radius: 10px;
  background: var(--green);
  box-shadow: 0 8px 16px -12px rgba(23, 128, 18, .75);
}
.brand-mark img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.version {
  font-size: 11px;
  font-weight: 800;
  color: var(--gray);
}
.hero h1 {
  font-size: 33px;
  line-height: 1.22;
  font-weight: 900;
  letter-spacing: -0.035em;
}
.hero h1 span { color: var(--green-2); }
.hero p {
  margin-top: 14px;
  font-size: 14.5px;
  line-height: 1.62;
  color: var(--ink-2);
  font-weight: 600;
}
.preview {
  margin-top: 38px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.preview-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 14px 0 11px;
  border-bottom: 1px solid var(--line);
}
.preview-head strong {
  font-size: 13px;
  font-weight: 900;
  color: var(--ink);
}
.preview-head span {
  font-size: 11px;
  font-weight: 800;
  color: var(--gray);
}
.tool-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 11px;
  align-items: center;
  padding: 15px 0;
}
.tool-row + .tool-row { border-top: 1px solid var(--line); }
.tool-ic {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--green-2);
}
.tool-ic .ic { font-size: 21px; }
.tool-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.012em;
}
.tool-desc {
  margin-top: 3px;
  font-size: 12px;
  color: var(--gray);
  font-weight: 700;
}
.tool-state {
  font-size: 10.5px;
  color: var(--green-2);
  font-weight: 900;
  white-space: nowrap;
}
.actions {
  margin-top: auto;
  padding-top: 34px;
  padding-bottom: 34px;
}
.start-btn {
  height: 56px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(180deg, #45BC38 0%, var(--green) 54%, var(--green-2) 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: -0.012em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 12px 20px -14px rgba(25,126,22,.8);
}
.start-btn .ic { font-size: 18px; }
</style>
</head>
<body>

    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1"/><path d="M8 9h8"/><path d="M8 12.5h5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h2a2 2 0 0 0 2-2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1a2 2 0 0 0 2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M13 8h3"/><path d="M13 12h3"/><path d="M8 8h2"/><path d="M8 12h2"/><path d="M8 16h2"/></symbol>

    <symbol id="i-kakao" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7-.2.7-.7 2.5-.8 2.9 0 .2.1.4.4.2.3-.2 3-2 4.2-2.8.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></symbol>
    <symbol id="i-naver" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h4.6l4.8 7.2V4H19v16h-4.6L9.6 12.8V20H5z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12.5c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7s2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.8 5.2c.6-.8 1-1.9.9-3-1 0-2.1.7-2.8 1.5-.6.7-1.1 1.8-.9 2.8 1.1.1 2.2-.5 2.8-1.3z"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.6-.1-1.3-.2-1.9H12v3.6h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6C4.7 19.9 8.1 22 12 22z"/><path fill="#FBBC05" d="M6.4 13.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.3H3.1C2.4 8.7 2 10.3 2 12s.4 3.3 1.1 4.7l3.3-2.6z"/><path fill="#EA4335" d="M12 6.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.5 14.7 2.6 12 2.6 8.1 2.6 4.7 4.7 3.1 7.9l3.3 2.6C7.2 8.1 9.4 6.4 12 6.4z"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg><svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <main class="screen">
      <header class="brand">
        <div class="brand-name"><span class="brand-mark"><img src="img/friend-logo.png" alt=""/></span>농사친구</div>
        <span class="version">KS FARM</span>
      </header>

      <section class="hero">
        <h1>농사 고민을<br><span>한 번에 정리하세요</span></h1>
        <p>질문, 병해진단, 영농 기록까지<br>오늘 필요한 농장 관리를 바로 시작합니다.</p>
      </section>

      <section class="preview" aria-label="주요 기능">
        <div class="preview-head"><strong>바로 할 수 있는 일</strong><span>3개 핵심 기능</span></div>
        <div class="tool-row">
          <span class="tool-ic"><svg class="ic"><use href="#i-chat"/></svg></span>
          <div><div class="tool-title">AI 상담</div><div class="tool-desc">작물·재배·병해충 질문 정리</div></div>
          <span class="tool-state">즉시</span>
        </div>
        <div class="tool-row">
          <span class="tool-ic"><svg class="ic"><use href="#i-camera"/></svg></span>
          <div><div class="tool-title">작물 병해진단</div><div class="tool-desc">사진 기반 상태 확인</div></div>
          <span class="tool-state">사진</span>
        </div>
        <div class="tool-row">
          <span class="tool-ic"><svg class="ic"><use href="#i-notebook"/></svg></span>
          <div><div class="tool-title">영농 관리</div><div class="tool-desc">일지, 시세, 맞춤 정보 연결</div></div>
          <span class="tool-state">기록</span>
        </div>
      </section>

      <section class="actions">
        <a class="start-btn" href="auth/signup-terms.html">농사친구 시작하기 <svg class="ic"><use href="#i-arrow"/></svg></a>
      </section>
    </main>
  </div>
</body>
</html>
