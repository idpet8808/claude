<script>
    document.querySelectorAll('.cat').forEach(function(c){ c.addEventListener('click', function(){ document.querySelectorAll('.cat').forEach(function(x){ x.classList.remove('on'); }); c.classList.add('on'); }); });

    // 상단 검색창 토글 (지원사업과 동일)
    var searchBtn = document.getElementById('searchBtn');
    var searchTop = document.getElementById('searchTop');
    var searchInput = document.getElementById('searchInput');
    if (searchBtn && searchTop) {
      searchBtn.addEventListener('click', function(){
        var open = searchTop.classList.toggle('open');
        searchBtn.classList.toggle('on', open);
        if (open) { setTimeout(function(){ searchInput && searchInput.focus(); }, 80); }
        else { searchInput && searchInput.blur(); }
      });
    }
