<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 비밀번호 변경</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/pwchange.css"/>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol><symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol></defs></svg>


  <div class="phone">
    <div class="backhint" aria-hidden="true">
      <div class="bh-field"><div class="l">이메일</div><div class="v">summertoohotplzstop@gmail.com</div></div>
      <div class="bh-field"><div class="l">닉네임</div><div class="v">utii</div></div>
    </div>
    <div class="scrim"></div>

    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title">비밀번호를<br>변경해 주세요</h2>
        <a class="sheet-close" href="editprofile.html"><svg class="ic"><use href="#i-x"/></svg></a>
      </div>

      <div class="field">
        <label class="lab" for="pw-cur">현재 비밀번호</label>
        <div class="box"><input class="inp" id="pw-cur" type="password" placeholder="현재 비밀번호 입력" /><button class="eye"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <div class="field" id="field-new">
        <label class="lab" for="pw-new">새 비밀번호</label>
        <div class="box"><input class="inp" id="pw-new" type="password" placeholder="새 비밀번호 입력" /><button class="eye"><svg class="ic"><use href="#i-eye"/></svg></button></div>
        <p class="err-msg">영문·숫자·특수문자 포함 8~20자로 입력해 주세요.</p>
      </div>

      <div class="field" id="field-cfm">
        <label class="lab" for="pw-cfm">비밀번호 확인</label>
        <div class="box"><input class="inp" id="pw-cfm" type="password" placeholder="새 비밀번호 재입력" /><button class="eye"><svg class="ic"><use href="#i-eye"/></svg></button></div>
        <p class="err-msg">비밀번호가 일치하지 않아요.</p>
      </div>

      <p class="hint"><svg class="ic"><use href="#i-info"/></svg> 영문·숫자 포함 8자 이상으로 설정해 주세요.</p>

      <div class="sheet-foot"><button class="btn-save">비밀번호 변경</button></div>
    </section>
  </div>

  <script>
    document.querySelectorAll('.eye').forEach(function(btn){
      btn.addEventListener('click', function(){
        var inp = btn.parentElement.querySelector('.inp');
        var use = btn.querySelector('use');
        if (inp.type === 'password') { inp.type = 'text'; use.setAttribute('href', '#i-eye-off'); }
        else { inp.type = 'password'; use.setAttribute('href', '#i-eye'); }
      });
    });
    var btnSave = document.querySelector('.btn-save');
    var fNew = document.getElementById('field-new'), fCfm = document.getElementById('field-cfm');
    var iNew = document.getElementById('pw-new'), iCfm = document.getElementById('pw-cfm');
    var rule = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,20}$/;
    function setErr(f, on){ f.classList.toggle('show-err', on); f.querySelector('.box').classList.toggle('err', on); }
    btnSave.addEventListener('click', function(){
      var okNew = rule.test(iNew.value);
      var okCfm = iCfm.value !== '' && iCfm.value === iNew.value;
      setErr(fNew, !okNew); setErr(fCfm, !okCfm);
      if (okNew && okCfm) window.location.href = 'editprofile.html';
    });
    [iNew, iCfm].forEach(function(inp){ inp.addEventListener('input', function(){ var f = inp.closest('.field'); if (f.classList.contains('show-err')) setErr(f, false); }); });
  </script>
</body>
</html>
