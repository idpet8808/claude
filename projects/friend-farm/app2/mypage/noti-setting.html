<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 알림 설정</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/noti-setting.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../mypage/settings.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">알림 설정</span><a class="menu" href="../menu.html" aria-label="메뉴"><svg class="ic"><use href="#i-menu"/></svg></a></div>
<div class="scroll">
      <div class="sec-label">전체 알림</div>
      <div class="master"><span class="t">푸시 알림 받기</span><button class="toggle on" data-toggle><span class="knob"></span></button></div>
      <p class="help">전체 알림을 끄면 아래 개별 알림도 받지 않아요.</p>

      <div class="sec-label">알림 종류</div>
      <div class="n-group">
        <div class="row"><div class="txt"><div class="t">전문가 답변</div><div class="d">질문에 답변이 등록되면 알려드려요</div></div><button class="toggle on" data-toggle><span class="knob"></span></button></div>
        <div class="row"><div class="txt"><div class="t">1:1 문의 답변</div><div class="d">문의하신 내용에 답변이 오면 알려드려요</div></div><button class="toggle on" data-toggle><span class="knob"></span></button></div>
      </div>
    </div>
<script>
    document.querySelectorAll('[data-toggle]').forEach(function(t){ t.addEventListener('click', function(){ t.classList.toggle('on'); }); });
  </script>

  </div>

</body>
</html>
