<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 회원정보 수정</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/editprofile.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol><symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../mypage/mypage.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">회원정보 수정</span><a class="menu" href="../menu.html" aria-label="메뉴"><svg class="ic"><use href="#i-menu"/></svg></a></div>
<div class="scroll">
      <h2 class="lead">회원정보를<br>수정해 주세요</h2>
      <div class="field readonly"><label class="lab">아이디</label><div class="box"><span class="val">test4</span><svg class="ic lock"><use href="#i-lock"/></svg></div></div>
      <div class="field linkrow"><label class="lab">비밀번호</label><a class="box" href="pwchange.html"><span class="pw">••••••••</span><span class="go">변경 <svg class="ic"><use href="#i-cv"/></svg></span></a></div>
      <div class="field"><label class="lab" for="f-name">이름</label><div class="box"><input class="inp" id="f-name" type="text" value="김팜" /><button class="clear"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
      <div class="field"><label class="lab" for="f-nick">닉네임</label><div class="box"><input class="inp" id="f-nick" type="text" value="utii" /><button class="clear"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
      <div class="field"><label class="lab" for="f-email">이메일</label><div class="box"><input class="inp" id="f-email" type="email" value="summertoohotplzstop@gmail.com" /><button class="clear"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
      <div class="field"><label class="lab" for="f-phone">휴대폰 번호</label><div class="box"><input class="inp" id="f-phone" type="tel" value="010-0020-3003" /><button class="clear"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
      <p class="help">아이디는 변경할 수 없어요. 비밀번호는 '변경'에서 따로 바꿀 수 있어요.</p>
    </div>

    <div class="foot">
      <button class="btn btn-quit" id="btnQuit">회원 탈퇴</button>
      <button class="btn btn-save" id="btnSave">정보 수정</button>
    </div>

    <div class="toast-wrap" id="toast"><div class="toast"><span class="tic"><svg class="ic"><use href="#i-check"/></svg></span><span class="tt">회원정보가 수정되었어요</span></div></div>

    <div class="scrim" id="quitDialog">
      <div class="dialog">
        <div class="dlg-title">정말 탈퇴하시겠어요?</div>
        <div class="dlg-desc">탈퇴하면 회원정보와 그동안의<br>영농일지·진단 기록이 모두 삭제돼요.</div>
        <div class="dlg-actions">
          <button class="dlg-btn dlg-cancel" id="quitCancel">계속 이용하기</button>
          <button class="dlg-btn dlg-danger" id="quitConfirm">탈퇴할게요</button>
        </div>
      </div>
    </div>
<script>
    document.querySelectorAll('.clear').forEach(function(btn){ btn.addEventListener('click', function(){ var inp = btn.parentElement.querySelector('.inp'); if (inp) { inp.value = ''; inp.focus(); } }); });
    var toast = document.getElementById('toast'); var toastTimer;
    document.getElementById('btnSave').addEventListener('click', function(){ toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200); });
    var dialog = document.getElementById('quitDialog');
    document.getElementById('btnQuit').addEventListener('click', function(){ dialog.classList.add('show'); });
    document.getElementById('quitCancel').addEventListener('click', function(){ dialog.classList.remove('show'); });
    document.getElementById('quitConfirm').addEventListener('click', function(){ dialog.classList.remove('show'); window.location.href = '../index.html'; });
    dialog.addEventListener('click', function(e){ if (e.target === dialog) dialog.classList.remove('show'); });
  </script>

  </div>

</body>
</html>
