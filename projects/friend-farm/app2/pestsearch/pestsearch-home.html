<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 병해충 정보</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/pestsearch-home.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol><symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol><symbol id="i-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 16l-5-5L5 20"/></symbol><symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../home.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">병해충 정보</span><a class="menu" href="../menu.html" aria-label="메뉴"><svg class="ic"><use href="#i-menu"/></svg></a></div>
<div class="scroll">
      <!-- 검색 히어로 -->
      <div class="hero">
        <h1>무슨 병해충인지<br><b>찾아보세요</b></h1>
        <p class="sub">작물 이름이나 병해충 이름으로<br>증상과 방제법을 확인할 수 있어요.</p>
        <a class="searchbar" href="pestsearch-search.html">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="text" placeholder="예) 토마토, 탄저병" readonly/>
        </a>
      </div>

      <!-- 조회 많은 병해충 (칩) -->
      <div class="popular">
        <p class="pop-lbl">조회 많은 병해충</p>
        <div class="pchips">
          <a class="pchip" href="pestsearch-search.html?q=탄저병"><span class="rk">1</span>탄저병<span class="dot dis"></span></a>
          <a class="pchip" href="pestsearch-search.html?q=진딧물"><span class="rk">2</span>진딧물<span class="dot pst"></span></a>
          <a class="pchip" href="pestsearch-search.html?q=노균병"><span class="rk">3</span>노균병<span class="dot dis"></span></a>
          <a class="pchip" href="pestsearch-search.html?q=총채벌레"><span class="rk">4</span>총채벌레<span class="dot pst"></span></a>
          <a class="pchip" href="pestsearch-search.html?q=역병"><span class="rk">5</span>역병<span class="dot dis"></span></a>
        </div>
      </div>

      <!-- 내 농장 작물 병해충 -->
      <div class="myfarm">
        <p class="mf-lbl">내 농장 작물에 조심할 병해충</p>
        <div class="crop-tabs">
          <button class="crop-tab on" data-crop="오이">오이</button>
          <button class="crop-tab" data-crop="딸기">딸기</button>
        </div>
        <div class="pest-list" id="pestList"></div>
        <a class="pest-more" id="pestMore">전체 보기</a>
      </div>
    </div>
<script>
    var DATA = {
      '오이': [
        {nm:'노균병', kind:'dis', sci:'Pseudoperonospora cubensis'},
        {nm:'흰가루병', kind:'dis', sci:'Sphaerotheca fuliginea'},
        {nm:'탄저병', kind:'dis', sci:'Colletotrichum orbiculare'},
        {nm:'총채벌레', kind:'pst', sci:'Frankliniella occidentalis'}
      ],
      '딸기': [
        {nm:'잿빛곰팡이병', kind:'dis', sci:'Botrytis cinerea'},
        {nm:'흰가루병', kind:'dis', sci:'Sphaerotheca aphanis'},
        {nm:'점박이응애', kind:'pst', sci:'Tetranychus urticae'}
      ]
    };
    var SEARCH = 'pestsearch-search.html';
    var listEl = document.getElementById('pestList');
    var moreEl = document.getElementById('pestMore');
    var LIMIT = 2;

    function itemHTML(d){
      var tag = d.kind==='dis' ? '<span class="ptag dis">병</span>' : '<span class="ptag pst">해충</span>';
      return '<a class="pest-item" href="'+SEARCH+'?q='+encodeURIComponent(d.nm)+'">'
        + '<span class="thumb"><svg class="ic"><use href="#i-img"/></svg></span>'
        + '<span class="pm"><span class="pn">'+d.nm+' '+tag+'</span><span class="psci">'+d.sci+'</span></span>'
        + '<svg class="ic cv"><use href="#i-cv"/></svg></a>';
    }
    function render(crop){
      var arr = DATA[crop];
      listEl.innerHTML = arr.slice(0, LIMIT).map(itemHTML).join('');
      moreEl.href = SEARCH + '?q=' + encodeURIComponent(crop);
      moreEl.textContent = crop + ' 병해충 전체 보기';
    }
    document.querySelectorAll('.crop-tab').forEach(function(t){
      t.addEventListener('click', function(){
        document.querySelectorAll('.crop-tab').forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        render(t.dataset.crop);
      });
    });
    render('오이');
  </script>

  </div>

</body>
</html>
