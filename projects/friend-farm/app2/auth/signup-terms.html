<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 약관 동의</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/signup-terms.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol><symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../auth/login.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">약관 동의</span><span class="sp"></span></div>
<div class="progress">
      <div class="bar"><i></i></div>
      <div class="step">1 / 2 단계 · 약관 동의</div>
    </div>

    <div class="scroll">
      <h2 class="lead">약관에 동의해 주세요</h2>
      <p class="lead-sub">농사친구 서비스를 이용하려면<br>아래 약관 동의가 필요해요.</p>

      <div class="ag-all">
        <button class="chk" id="agAll" aria-label="전체 동의"><svg class="ic"><use href="#i-check"/></svg></button>
        <span class="t">약관 전체 동의<span class="d">필수·선택 약관에 모두 동의합니다</span></span>
      </div>

      <div class="ag-list">
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 서비스 이용약관</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 개인정보 처리방침</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 위치기반 서비스 이용약관</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="0"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="opt">[선택]</span> 마케팅 정보 수신 동의</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
      </div>
    </div>

    <div class="foot">
      <a class="btn-next" id="next" href="signup.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;pointer-events:none;opacity:.4;">동의하고 계속하기</a>
    </div>
<script src="../js/signup-terms.js"></script>
<script>
    // 동의 완료 시 다음 페이지 링크 활성화
    (function () {
      var next = document.getElementById('next');
      var items = document.querySelectorAll('.ag-item');
      var observer = new MutationObserver(function () {
        var reqOk = Array.from(items).filter(function (i) { return i.dataset.req === '1'; })
          .every(function (i) { return i.classList.contains('on'); });
        next.style.pointerEvents = reqOk ? 'auto' : 'none';
        next.style.opacity = reqOk ? '1' : '.4';
      });
      items.forEach(function (i) {
        observer.observe(i, { attributes: true, attributeFilter: ['class'] });
      });
    })();
  </script>

  </div>

</body>
</html>
