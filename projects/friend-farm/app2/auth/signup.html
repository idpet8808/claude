<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 회원가입</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/signup.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol><symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../auth/signup-terms.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">회원가입</span><span class="sp"></span></div>
<div class="progress">
      <div class="bar"><i></i></div>
      <div class="step">2 / 2 단계 · 정보 입력</div>
    </div>

    <div class="scroll">
      <h2 class="lead">가입 정보를<br>입력해 주세요</h2>
      <p class="lead-sub"><span class="req">*</span> 표시는 필수 입력 항목이에요.</p>

      <div class="field">
        <label class="lab" for="s-id">아이디 <span class="req">*</span></label>
        <div class="row2">
          <div class="box"><input class="inp" id="s-id" type="text" placeholder="영문, 숫자 4~20자" /></div>
          <button class="mini">중복확인</button>
        </div>
      </div>

      <div class="field">
        <label class="lab" for="s-pw">비밀번호 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-pw" type="password" placeholder="영문·숫자·특수문자 8~20자" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <div class="field">
        <label class="lab" for="s-pw2">비밀번호 확인 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-pw2" type="password" placeholder="비밀번호 재입력" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <div class="field">
        <label class="lab" for="s-name">이름 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-name" type="text" placeholder="이름" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-nick">닉네임 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-nick" type="text" placeholder="닉네임" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-email">이메일 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-email" type="email" placeholder="example@email.com" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-phone">휴대폰 번호</label>
        <div class="box"><input class="inp" id="s-phone" type="tel" placeholder="010-0000-0000" /></div>
      </div>
    </div>

    <div class="foot">
      <a class="btn-submit" href="../home.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">회원가입</a>
    </div>
<script src="../js/signup.js"></script>

  </div>

</body>
</html>
