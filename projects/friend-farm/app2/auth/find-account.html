<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 계정 찾기</title>
<link rel="stylesheet" href="../css/common.css"/>
<link rel="stylesheet" href="../css/components.css"/>
<link rel="stylesheet" href="../css/find-account.css"/>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol></defs></svg>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span></div>
    <div class="appbar"><a class="back" href="../auth/login.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a><span class="title">계정 찾기</span><span class="sp"></span></div>
<div class="tabs">
      <button class="tab on" data-tab="id">아이디 찾기</button>
      <button class="tab" data-tab="pw">비밀번호 찾기</button>
    </div>
    <div class="tabline"></div>

    <!-- 아이디 찾기 -->
    <div class="scroll pane-id">
      <h2 class="lead">가입 시 등록한<br>정보로 아이디를 찾아요</h2>
      <p class="lead-sub">본인 확인 후 아이디를 알려드릴게요.</p>

      <div class="field" id="id-name">
        <label class="lab">이름</label>
        <div class="box"><input class="inp" type="text" placeholder="이름" /></div>
        <p class="err-msg">이름을 입력해 주세요.</p>
      </div>
      <div class="field" id="id-email">
        <label class="lab">이메일</label>
        <div class="row2">
          <div class="box"><input class="inp" type="email" placeholder="가입한 이메일" /></div>
          <button class="mini" data-req-email="id-email,id-name">인증요청</button>
        </div>
        <p class="err-msg">올바른 이메일 형식을 입력해 주세요.</p>
      </div>
      <div class="field">
        <label class="lab">인증번호</label>
        <div class="row2">
          <div class="box"><input class="inp" type="number" placeholder="인증번호 6자리" /></div>
          <button class="mini">확인</button>
        </div>
      </div>
    </div>

    <!-- 비밀번호 찾기 -->
    <div class="scroll pane-pw hidden">
      <h2 class="lead">본인 확인 후<br>비밀번호를 재설정해요</h2>
      <p class="lead-sub">가입한 아이디와 이메일로 본인 확인해요.</p>

      <div class="field" id="pw-id">
        <label class="lab">아이디</label>
        <div class="box"><input class="inp" type="text" placeholder="아이디" /></div>
        <p class="err-msg">아이디를 입력해 주세요.</p>
      </div>
      <div class="field" id="pw-email">
        <label class="lab">이메일</label>
        <div class="row2">
          <div class="box"><input class="inp" type="email" placeholder="가입한 이메일" /></div>
          <button class="mini" data-req-email="pw-email,pw-id">인증요청</button>
        </div>
        <p class="err-msg">올바른 이메일 형식을 입력해 주세요.</p>
      </div>
      <div class="field">
        <label class="lab">인증번호</label>
        <div class="row2">
          <div class="box"><input class="inp" type="number" placeholder="인증번호 6자리" /></div>
          <button class="mini">확인</button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="btn-submit" id="submitBtn">아이디 찾기</button>
    </div>
<script src="../js/find-account.js"></script>

  </div>

</body>
</html>
