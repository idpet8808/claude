<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 농장 정보 수정</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --red: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative;
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 860px; display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
  .lead { font-size: 21px; font-weight: 800; letter-spacing: -0.024em; line-height: 1.34; margin: 8px 2px 22px; }

  .sec-label { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.018em; padding: 10px 2px 12px; margin-top: 8px; }
  .sec-label:first-of-type { margin-top: 0; }
  .sec-guide { font-size: 12px; color: var(--gray); margin: -4px 2px 12px; line-height: 1.5; }

  .field { margin-bottom: 14px; }
  .field .lab { display: block; font-size: 12.5px; font-weight: 700; color: var(--gray); margin-bottom: 7px; padding-left: 2px; letter-spacing: -0.01em; }
  .field .lab .req { color: var(--red); }
  .field .box { display: flex; align-items: center; gap: 8px; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; height: 52px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .field .box .pin { color: var(--green); font-size: 18px; }
  .field .inp { flex: 1; width: 100%; border: 0; background: transparent; padding: 0; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none; }
  .field .inp::placeholder { color: #ADAFa4; font-weight: 500; }
  .field .box:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }

  /* 라디오 (재배방법) */
  .radio-row { display: flex; gap: 10px; }
  .radio { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: var(--r-md); background: var(--field-bg); border: 1.5px solid transparent; font-size: 14.5px; font-weight: 700; color: var(--gray); transition: all .12s; }
  .radio .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #C4C5BB; position: relative; flex-shrink: 0; transition: border-color .12s; }
  .radio.on { background: var(--green-soft); border: 2px solid var(--green); color: var(--green); font-weight: 800; }
  .radio.on .dot { border-color: var(--green); border-width: 2px; }
  .radio.on .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--green); }

  /* 단위 토글 (면적) */
  .unit-toggle { display: flex; background: var(--field-bg); border-radius: var(--r-md); padding: 4px; margin-bottom: 14px; }
  .unit-toggle button { flex: 1; height: 42px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--gray); }
  .unit-toggle button.on { background: var(--card); color: var(--green); box-shadow: 0 1px 3px rgba(36,30,18,.12); }

  /* 작물 추가 버튼 */
  .btn-add { width: 100%; height: 50px; border-radius: var(--r-md); font-size: 14.5px; font-weight: 800; color: var(--green); background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
  .btn-add .ic { font-size: 17px; }
  .btn-add:active { background: var(--field-bg); }

  /* 추가된 작물 카드 리스트 */
  .added-wrap { margin-top: 18px; }
  .added-label { font-size: 12.5px; font-weight: 700; color: var(--gray); padding: 0 2px 9px; }
  .added-label .added-n { color: var(--green); font-weight: 800; }
  .added-list { display: flex; flex-direction: column; gap: 8px; }
  .added-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 14px 12px 14px 16px; }
  .ai-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 9px; }
  .ai-name { font-size: 14.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.014em; }
  .ai-meta { font-size: 12.5px; font-weight: 600; color: var(--gray); }
  .ai-x { width: 26px; height: 26px; border-radius: 50%; background: var(--field-bg); color: var(--gray); display: grid; place-items: center; flex-shrink: 0; }
  .ai-x .ic { font-size: 13px; }

  /* 드롭다운 (대표 작물) */
  .select-box { display: flex; align-items: center; background: var(--field-bg); border-radius: var(--r-md); padding: 0 14px; height: 52px; width: 100%; text-align: left; }
  .select-box .val { flex: 1; font-size: 16px; font-weight: 600; color: var(--ink); }
  .select-box .val.ph { color: #ADAFa4; font-weight: 500; }
  .select-box .cv { color: var(--gray); font-size: 18px; }

  /* 바텀시트 */
  .sheet-scrim { position: absolute; inset: 0; background: rgba(24,20,12,.45); z-index: 20; border-radius: 30px; overflow: hidden;
    opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility .28s ease; }
  .sheet-scrim.show { opacity: 1; visibility: visible; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; height: 72%; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .42s cubic-bezier(.22,1,.36,1); }
  .sheet-scrim.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 38px; height: 4px; border-radius: 999px; background: #DAD9CF; margin: 10px auto 4px; flex-shrink: 0; }
  .sheet-title { font-size: 16.5px; font-weight: 800; letter-spacing: -0.018em; text-align: center; padding: 8px 0 14px; flex-shrink: 0; }
  .sheet-search { margin: 0 20px 12px; flex-shrink: 0; }
  .sheet-search .box { display: flex; align-items: center; gap: 8px; background: var(--field-bg); border-radius: var(--r-md); padding: 0 14px; height: 48px; }
  .sheet-search .box .ic { color: var(--gray); font-size: 18px; }
  .sheet-search input { flex: 1; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--ink); outline: none; }
  .sheet-search input::placeholder { color: #ADAFa4; font-weight: 500; }
  .sheet-list { overflow-y: auto; padding: 0 12px 24px; }
  .sheet-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 14px 12px; border-radius: 12px; font-size: 15.5px; font-weight: 600; color: var(--ink); }
  .sheet-item:active { background: var(--field-bg); }
  .sheet-item .emoji { font-size: 20px; width: 26px; text-align: center; }
  .sheet-item.on { color: var(--green); font-weight: 800; }
  .sheet-item.on::after { content: ""; margin-left: auto; width: 18px; height: 18px; }

  /* 2컬럼 연동 선택 */
  .two-col { display: flex; overflow: hidden; border-top: 1px solid var(--line); min-height: 0; flex: 1; }
  .col-item { flex: 0 0 44%; overflow-y: auto; background: var(--bg); padding: 8px 0; }
  .col-variety { flex: 1; overflow-y: auto; padding: 8px 0; background: var(--card); }
  .ci { display: flex; align-items: center; width: 100%; text-align: left; padding: 14px 18px; font-size: 14.5px; font-weight: 600; color: var(--gray); position: relative; }
  .ci.on { background: var(--card); color: var(--green); font-weight: 800; border-radius: 12px 0 0 12px; }
  .ci.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); border-radius: 2px 0 0 2px; }
  .cv-item { display: flex; align-items: center; width: 100%; text-align: left; padding: 14px 18px; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .cv-item:active { background: var(--field-bg); }
  .cv-item:first-child { color: var(--gray); font-weight: 500; }

  /* 시트 하단: 재식주수 + 추가 */
  .sheet-foot { flex-shrink: 0; border-top: 1px solid var(--line); padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--card); }
  .sf-selected { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 10px; padding-left: 2px; }
  .sf-row { display: flex; gap: 8px; }
  .sf-jusu { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; height: 50px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .sf-jusu input { flex: 1; width: 100%; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--ink); outline: none; }
  .sf-jusu input::placeholder { color: #ADAFa4; font-weight: 500; }
  .sf-jusu .unit { font-size: 13px; color: var(--gray); font-weight: 600; }
  .sf-jusu:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }
  .sf-add { flex: 0 0 88px; height: 50px; border-radius: var(--r-md); color: #fff; font-size: 15px; font-weight: 800;
    background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 14px -6px rgba(22,55,41,.5); }
  .sf-confirm { width: 100%; height: 52px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800;
    background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); transition: opacity .15s; }
  .sf-confirm:disabled { opacity: .4; }

  /* 등록 완료 모달 */
  .modal-scrim { position: absolute; inset: 0; background: rgba(24,20,12,.5); z-index: 30; border-radius: 30px; overflow: hidden; display: grid; place-items: center; padding: 0 32px;
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
  .modal-scrim.show { opacity: 1; visibility: visible; }
  .modal { width: 100%; max-width: 320px; background: var(--card); border-radius: 22px; padding: 30px 24px 20px; text-align: center;
    transform: scale(.92); transition: transform .28s cubic-bezier(.22,1,.36,1); }
  .modal-scrim.show .modal { transform: scale(1); }
  .modal-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; margin: 0 auto 16px; }
  .modal-ic .ic { font-size: 34px; }
  .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .modal-desc { font-size: 13.5px; color: var(--gray); line-height: 1.6; margin-top: 10px; font-weight: 500; }
  .modal-btn { width: 100%; height: 52px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; margin-top: 22px;
    background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  /* 사진 업로드 (추가 타일 + 썸네일) */
  .photo-help { font-size: 12px; color: var(--gray); margin: 0 2px 12px; line-height: 1.5; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-tile { width: 64px; height: 48px; flex: 0 0 auto; border-radius: 12px; background: var(--field-bg); border: 1.5px dashed rgba(31,75,60,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--green); }
  .add-tile .ic { font-size: 18px; }
  .add-tile .cnt { font-size: 9.5px; font-weight: 700; color: var(--gray); }
  .pthumb { position: relative; width: 64px; height: 48px; flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: linear-gradient(155deg, #3A6B57, var(--green) 65%, var(--green-2)); }
  .pthumb .x { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
  .pthumb .x .ic { font-size: 8px; }
  .pthumb .rep-tag { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 8px; font-weight: 800; color: #fff; background: rgba(0,0,0,.4); padding: 1px 0; }

  /* 대표농장 토글 */
  .rep-row { display: flex; align-items: center; gap: 12px; padding: 16px 2px 4px; }
  .rep-row .t { flex: 1; font-size: 15px; font-weight: 700; letter-spacing: -0.014em; }
  .toggle { width: 46px; height: 28px; border-radius: 999px; background: #D6D5CB; position: relative; flex: 0 0 46px; transition: background .15s; }
  .toggle.on { background: var(--green); }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
  .toggle.on .knob { transform: translateX(18px); }

  .divider-line { height: 1px; background: var(--line); margin: 22px 0 18px; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-submit { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-cv-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>

    <symbol id="i-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 16l-5-5L5 20"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></symbol>
    <symbol id="i-check-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">농장 정보 수정</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <h2 class="lead">농장 정보를<br>수정해 주세요</h2>

      <!-- 농장정보 -->
      <div class="sec-label">농장정보</div>
      <div class="field">
        <label class="lab">농장이름 <span class="req">*</span></label>
        <div class="box"><input class="inp" type="text" value="강남 역삼 농원" placeholder="예) 스마트팜 하우스 농장" /></div>
      </div>
      <div class="field">
        <label class="lab">농장위치 <span class="req">*</span></label>
        <button class="select-box" id="openRegion"><svg class="ic pin" style="margin-right:6px"><use href="#i-pin"/></svg><span class="val">서울특별시 종로구</span><svg class="ic cv"><use href="#i-cv-down"/></svg></button>
      </div>
      <div class="field">
        <label class="lab">재배방법</label>
        <div class="radio-row">
          <button class="radio on" data-radio="method"><span class="dot"></span>토경재배</button>
          <button class="radio" data-radio="method"><span class="dot"></span>수경재배</button>
        </div>
      </div>

      <!-- 면적정보 -->
      <div class="sec-label">면적정보</div>
      <div class="unit-toggle">
        <button class="on" data-unit>㎡</button>
        <button data-unit>평</button>
      </div>
      <div class="field">
        <label class="lab">재배면적</label>
        <div class="box"><input class="inp" type="number" value="1200" placeholder="숫자 입력" /></div>
      </div>

      <!-- 재배작물 정보 -->
      <div class="sec-label">재배작물 정보</div>
      <p class="sec-guide">재배 중인 작물을 최소 1가지 이상 추가해 주세요.</p>
      <button class="btn-add" id="openCrop"><svg class="ic"><use href="#i-plus"/></svg> 작물 추가</button>

      <div class="added-wrap">
        <div class="added-label">추가된 작물 <span class="added-n">2</span></div>
        <div class="added-list">
          <div class="added-item">
            <div class="ai-main"><span class="ai-name">오이 (백다다기)</span><span class="ai-meta">500주</span></div>
            <button class="ai-x"><svg class="ic"><use href="#i-x"/></svg></button>
          </div>
          <div class="added-item">
            <div class="ai-main"><span class="ai-name">딸기</span></div>
            <button class="ai-x"><svg class="ic"><use href="#i-x"/></svg></button>
          </div>
        </div>
      </div>

      <div class="divider-line"></div>

      <!-- 기타 -->
      <div class="sec-label">기타</div>
      <div class="field">
        <label class="lab">대표 재배작물</label>
        <div class="select-box"><span class="val">오이 (백다다기)</span><svg class="ic cv"><use href="#i-cv-down"/></svg></div>
      </div>

      <div class="field">
        <label class="lab">농장 사진 (선택)</label>
        <p class="photo-help">농장 사진을 등록하면 한눈에 알아보기 좋아요. 최대 5장.</p>
        <div class="photo-row">
          <button class="add-tile">
            <svg class="ic"><use href="#i-camera"/></svg>
            <span class="cnt">3 / 5</span>
          </button>
          <div class="pthumb"><button class="x"><svg class="ic"><use href="#i-x"/></svg></button><span class="rep-tag">대표</span></div>
          <div class="pthumb"><button class="x"><svg class="ic"><use href="#i-x"/></svg></button></div>
          <div class="pthumb"><button class="x"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </div>
      </div>

      <div class="rep-row">
        <span class="t">대표농장으로 설정</span>
        <button class="toggle on" data-toggle><span class="knob"></span></button>
      </div>
    </div>

    <div class="foot">
      <button class="btn-submit">농장 정보 수정</button>
    </div>

  <!-- 재배작물 선택 바텀시트 (2컬럼 연동) -->
  <div class="sheet-scrim" id="cropSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">재배작물 선택</div>
      <div class="sheet-search"><div class="box"><svg class="ic"><use href="#i-search"/></svg><input type="text" placeholder="작물 이름 검색" id="cropSearch" /></div></div>
      <div class="two-col">
        <!-- 왼쪽: 품목 -->
        <div class="col-item" id="cropCol">
          <button class="ci on" data-crop="오이">오이</button>
          <button class="ci" data-crop="토마토">토마토</button>
          <button class="ci" data-crop="딸기">딸기</button>
          <button class="ci" data-crop="상추">상추</button>
          <button class="ci" data-crop="고추">고추</button>
          <button class="ci" data-crop="파프리카">파프리카</button>
          <button class="ci" data-crop="배추">배추</button>
          <button class="ci" data-crop="감자">감자</button>
          <button class="ci" data-crop="고구마">고구마</button>
          <button class="ci" data-crop="옥수수">옥수수</button>
        </div>
        <!-- 오른쪽: 품종 (선택한 품목의) -->
        <div class="col-variety" id="varietyCol"></div>
      </div>
      <div class="sheet-foot">
        <div class="sf-selected" id="sfSelected">오이 선택됨</div>
        <div class="sf-row">
          <div class="sf-jusu"><input type="number" id="sfJusu" placeholder="재식주수 (선택)" /><span class="unit">주</span></div>
          <button class="sf-add" id="sfAdd">추가</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 지역 선택 바텀시트 (2컬럼 연동) -->
  <div class="sheet-scrim" id="regionSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">농장 지역 선택</div>
      <div class="two-col">
        <div class="col-item" id="sidoCol">
          <button class="ci on" data-sido="서울특별시">서울특별시</button>
          <button class="ci" data-sido="경기도">경기도</button>
          <button class="ci" data-sido="강원특별자치도">강원특별자치도</button>
          <button class="ci" data-sido="충청북도">충청북도</button>
          <button class="ci" data-sido="충청남도">충청남도</button>
          <button class="ci" data-sido="전북특별자치도">전북특별자치도</button>
          <button class="ci" data-sido="전라남도">전라남도</button>
          <button class="ci" data-sido="경상북도">경상북도</button>
          <button class="ci" data-sido="경상남도">경상남도</button>
          <button class="ci" data-sido="제주특별자치도">제주특별자치도</button>
        </div>
        <div class="col-variety" id="sigunguCol"></div>
      </div>
      <div class="sheet-foot">
        <div class="sf-selected" id="regionSelected">지역을 선택해 주세요</div>
        <button class="sf-confirm" id="regionConfirm" disabled>확인</button>
      </div>
    </div>
  </div>

  <!-- 등록 완료 모달 -->
  <div class="modal-scrim" id="doneModal">
    <div class="modal">
      <div class="modal-ic"><svg class="ic"><use href="#i-check-c"/></svg></div>
      <div class="modal-title">농장 정보 수정 완료</div>
      <div class="modal-desc">농장 정보를 수정했어요.</div>
      <button class="modal-btn" id="doneOk">확인</button>
    </div>
  </div>

  </div>

  <script>
    // 작물별 품종 데이터 (예시 — 실제는 마스터 데이터)
    var VARIETIES = {
      '오이': ['백다다기','가시오이','청장오이','조선오이'],
      '토마토': ['대저','찰토마토','방울토마토','대추방울'],
      '딸기': ['설향','죽향','금실','매향'],
      '상추': ['청상추','적상추','로메인','버터헤드'],
      '고추': ['청양고추','꽈리고추','오이고추','홍고추'],
      '파프리카': ['빨강','노랑','주황'],
      '배추': ['봄배추','가을배추','얼갈이'],
      '감자': ['수미','대지','두백'],
      '고구마': ['밤고구마','호박고구마','꿀고구마'],
      '옥수수': ['찰옥수수','대학찰','미백찰']
    };
    // 라디오
    document.querySelectorAll('[data-radio]').forEach(function(r){
      r.addEventListener('click', function(){
        document.querySelectorAll('[data-radio="'+r.dataset.radio+'"]').forEach(function(x){ x.classList.remove('on'); });
        r.classList.add('on');
      });
    });
    // 단위 토글
    document.querySelectorAll('[data-unit]').forEach(function(u){
      u.addEventListener('click', function(){
        document.querySelectorAll('[data-unit]').forEach(function(x){ x.classList.remove('on'); });
        u.classList.add('on');
      });
    });
    // 대표농장 토글
    document.querySelectorAll('[data-toggle]').forEach(function(t){
      t.addEventListener('click', function(){ t.classList.toggle('on'); });
    });
    // 추가된 작물 삭제 (초기 항목)
    document.querySelectorAll('.ai-x').forEach(function(x){
      x.addEventListener('click', function(){ x.closest('.added-item').remove(); updateCount(); });
    });
    // 사진 썸네일 삭제
    document.querySelectorAll('.pthumb .x').forEach(function(x){
      x.addEventListener('click', function(){ x.closest('.pthumb').remove(); });
    });

    // 바텀시트 공통 열기/닫기
    function openSheet(s){ s.classList.add('show'); }
    function closeSheet(s){ s.classList.remove('show'); }
    document.querySelectorAll('.sheet-scrim').forEach(function(s){
      s.addEventListener('click', function(e){
        if (!e.target.closest('.sheet')) closeSheet(s);
      });
    });

    var cropSheet = document.getElementById('cropSheet');
    var cropCol = document.getElementById('cropCol');
    var varietyCol = document.getElementById('varietyCol');
    var sfSelected = document.getElementById('sfSelected');
    var sfJusu = document.getElementById('sfJusu');
    var sfAdd = document.getElementById('sfAdd');
    var addedList = document.querySelector('.added-list');
    var addedN = document.querySelector('.added-n');
    var selectedCrop = '오이';
    var selectedVariety = '';

    document.getElementById('openCrop').addEventListener('click', function(){
      selectedCrop = '오이'; selectedVariety = '';
      cropCol.querySelectorAll('.ci').forEach(function(x){ x.classList.toggle('on', x.dataset.crop === '오이'); });
      renderVarieties(selectedCrop);
      sfJusu.value = '';
      updateSelected();
      openSheet(cropSheet);
    });

    function updateSelected(){
      sfSelected.textContent = (selectedVariety ? selectedCrop + ' (' + selectedVariety + ')' : selectedCrop) + ' 선택됨';
    }

    // 오른쪽 품종 목록 렌더
    function renderVarieties(crop){
      var list = VARIETIES[crop] || [];
      var html = '<button class="cv-item on" data-variety="">기타 (품종 선택 안 함)</button>';
      list.forEach(function(v){
        html += '<button class="cv-item" data-variety="'+v+'">'+v+'</button>';
      });
      varietyCol.innerHTML = html;
      selectedVariety = '';
      varietyCol.querySelectorAll('.cv-item').forEach(function(it){
        it.addEventListener('click', function(){
          varietyCol.querySelectorAll('.cv-item').forEach(function(x){ x.classList.remove('on'); });
          it.classList.add('on');
          selectedVariety = it.dataset.variety;
          updateSelected();
        });
      });
    }

    // 왼쪽 품목 클릭 → 오른쪽 갱신
    cropCol.querySelectorAll('.ci').forEach(function(it){
      it.addEventListener('click', function(){
        cropCol.querySelectorAll('.ci').forEach(function(x){ x.classList.remove('on'); });
        it.classList.add('on');
        selectedCrop = it.dataset.crop;
        renderVarieties(selectedCrop);
        updateSelected();
      });
    });

    // 추가 버튼 → 카드 리스트에 반영
    sfAdd.addEventListener('click', function(){
      var name = selectedVariety ? (selectedCrop + ' (' + selectedVariety + ')') : selectedCrop;
      var jusu = sfJusu.value.trim();
      var item = document.createElement('div');
      item.className = 'added-item';
      item.innerHTML = '<div class="ai-main"><span class="ai-name">' + name + '</span>' +
        (jusu ? '<span class="ai-meta">' + jusu + '주</span>' : '') + '</div>' +
        '<button class="ai-x"><svg class="ic"><use href="#i-x"/></svg></button>';
      item.querySelector('.ai-x').addEventListener('click', function(){ item.remove(); updateCount(); });
      addedList.appendChild(item);
      updateCount();
      closeSheet(cropSheet);
    });

    function updateCount(){ addedN.textContent = addedList.querySelectorAll('.added-item').length; }

    // 검색 (왼쪽 품목 필터)
    document.getElementById('cropSearch').addEventListener('input', function(){
      var q = this.value.trim().toLowerCase();
      cropCol.querySelectorAll('.ci').forEach(function(it){
        it.style.display = it.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
      });
    });

    // ===== 지역 선택 =====
    var SIGUNGU = {
      '서울특별시': ['종로구','중구','용산구','성동구','강남구','서초구','송파구','강서구','마포구','영등포구'],
      '경기도': ['수원시','성남시','용인시','고양시','양평군','가평군','광주시','이천시','여주시','평택시'],
      '강원특별자치도': ['춘천시','원주시','강릉시','동해시','홍천군','횡성군','평창군'],
      '충청북도': ['청주시','충주시','제천시','음성군','진천군'],
      '충청남도': ['천안시','아산시','서산시','논산시','당진시','예산군'],
      '전북특별자치도': ['전주시','군산시','익산시','정읍시','김제시','완주군'],
      '전라남도': ['목포시','여수시','순천시','나주시','해남군','고흥군'],
      '경상북도': ['포항시','경주시','안동시','구미시','상주시','영주시'],
      '경상남도': ['창원시','진주시','김해시','양산시','거제시','통영시'],
      '제주특별자치도': ['제주시','서귀포시']
    };
    var regionSheet = document.getElementById('regionSheet');
    var regionVal = document.querySelector('#openRegion .val');
    var sidoCol = document.getElementById('sidoCol');
    var sigunguCol = document.getElementById('sigunguCol');
    var regionSelected = document.getElementById('regionSelected');
    var regionConfirm = document.getElementById('regionConfirm');
    var selSido = '서울특별시', selSigungu = '';

    document.getElementById('openRegion').addEventListener('click', function(){
      selSido = '서울특별시'; selSigungu = '';
      sidoCol.querySelectorAll('.ci').forEach(function(x){ x.classList.toggle('on', x.dataset.sido === '서울특별시'); });
      renderSigungu(selSido);
      updateRegion();
      openSheet(regionSheet);
    });
    function updateRegion(){
      if (selSigungu) {
        regionSelected.textContent = selSido + ' ' + selSigungu;
        regionConfirm.disabled = false;
      } else {
        regionSelected.textContent = '시/군/구를 선택해 주세요';
        regionConfirm.disabled = true;
      }
    }
    function renderSigungu(sido){
      var list = SIGUNGU[sido] || [];
      sigunguCol.innerHTML = list.map(function(g){ return '<button class="cv-item" data-gu="'+g+'">'+g+'</button>'; }).join('');
      selSigungu = '';
      sigunguCol.querySelectorAll('.cv-item').forEach(function(it){
        it.addEventListener('click', function(){
          sigunguCol.querySelectorAll('.cv-item').forEach(function(x){ x.classList.remove('on'); });
          it.classList.add('on');
          selSigungu = it.dataset.gu;
          updateRegion();
        });
      });
    }
    sidoCol.querySelectorAll('.ci').forEach(function(it){
      it.addEventListener('click', function(){
        sidoCol.querySelectorAll('.ci').forEach(function(x){ x.classList.remove('on'); });
        it.classList.add('on');
        selSido = it.dataset.sido;
        renderSigungu(selSido);
        updateRegion();
      });
    });
    regionConfirm.addEventListener('click', function(){
      regionVal.textContent = selSido + ' ' + selSigungu;
      regionVal.classList.remove('ph');
      closeSheet(regionSheet);
    });

    // ===== 등록 완료 모달 =====
    var doneModal = document.getElementById('doneModal');
    document.querySelector('.btn-submit').addEventListener('click', function(){
      doneModal.classList.add('show');
    });
    document.getElementById('doneOk').addEventListener('click', function(){
      doneModal.classList.remove('show');
    });
  </script>
</body>
</html>
