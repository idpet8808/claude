<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 영농일지</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 8px 20px 90px; }

  .basis { display: flex; align-items: center; gap: 6px; margin: 6px 2px 16px; font-size: 12.5px; color: var(--gray); font-weight: 600; }
  .basis .ic { font-size: 14px; color: var(--sage); }
  .basis b { color: var(--ink); font-weight: 700; }

  /* 달력 카드 */
  .cal { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 16px 14px; margin-bottom: 18px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
  .cal-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); }
  .cal-nav button:active { background: var(--field-bg); }
  .cal-nav .ic { font-size: 17px; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--gray); padding: 4px 0; }
  .dow span.sun { color: #C0573E; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink); position: relative; }
  .day.empty { visibility: hidden; }
  .day.sun { color: #C0573E; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
  .day.on { background: var(--green); color: #fff; font-weight: 800; }
  .day.on .dot { background: #fff; }
  .day.today:not(.on) { background: var(--green-soft); font-weight: 800; }

  /* 선택 날짜 헤더 */
  .sel-head { display: flex; align-items: baseline; gap: 8px; margin: 4px 2px 12px; }
  .sel-head .d { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .sel-head .c { font-size: 12.5px; color: var(--gray); font-weight: 600; }

  /* 일지 카드 */
  .logs { display: flex; flex-direction: column; gap: 12px; }
  .log { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; }
  .log-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .log-tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 800; }
  .log-time { margin-left: auto; font-size: 11.5px; color: var(--gray); font-weight: 600; }
  .log-body { font-size: 13.5px; color: var(--ink-2); font-weight: 500; line-height: 1.55; }
  .log-photos { display: flex; gap: 6px; margin-top: 12px; }
  .log-photos .ph { width: 64px; height: 64px; border-radius: 10px; background: var(--field-bg); display: grid; place-items: center; color: #C7C8BE; flex-shrink: 0; }
  .log-photos .ph .ic { font-size: 22px; }
  .log-diag { display: flex; align-items: center; gap: 7px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #FBF4EE; font-size: 12.5px; font-weight: 700; color: var(--clay); }
  .log-diag .ic { font-size: 15px; }

  /* 빈 상태 */
  .empty-day { text-align: center; padding: 36px 20px; }
  .empty-day .t { font-size: 13.5px; color: var(--gray); font-weight: 600; line-height: 1.6; }

  /* FAB */
  .fab { position: absolute; right: 18px; bottom: 22px; height: 52px; padding: 0 22px; border-radius: 26px; background: var(--green); color: #fff; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 6px 18px -4px rgba(31,75,60,.5); }
  .fab .ic { font-size: 19px; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">영농일지</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <div class="basis"><svg class="ic"><use href="#i-pin"/></svg> <b>완주 청년농원</b> · 시설채소</div>

      <!-- 달력 -->
      <div class="cal">
        <div class="cal-head">
          <span class="cal-title">2026년 5월</span>
          <div class="cal-nav">
            <button aria-label="이전 달"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button aria-label="다음 달"><svg class="ic"><use href="#i-next"/></svg></button>
          </div>
        </div>
        <div class="dow"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- 선택 날짜 일지 -->
      <div class="sel-head">
        <span class="d">5월 27일 (화)</span>
        <span class="c">기록 2건</span>
      </div>
      <div class="logs">
        <div class="log">
          <div class="log-top">
            <span class="log-tag"><svg class="ic"><use href="#i-leaf"/></svg> 방제</span>
            <span class="log-time">오전 9:20</span>
          </div>
          <div class="log-body">오이 하우스 흰가루병 예방 약제 살포. 동별로 골고루 분사하고 환기 2시간 진행했음.</div>
          <div class="log-photos">
            <div class="ph"><svg class="ic"><use href="#i-cam"/></svg></div>
            <div class="ph"><svg class="ic"><use href="#i-cam"/></svg></div>
          </div>
          <div class="log-diag"><svg class="ic"><use href="#i-scan"/></svg> 병해진단 결과 연결 · 오이 흰가루병</div>
        </div>
        <div class="log">
          <div class="log-top">
            <span class="log-tag"><svg class="ic"><use href="#i-leaf"/></svg> 수확</span>
            <span class="log-time">오후 4:10</span>
          </div>
          <div class="log-body">딸기 2번 동 수확. 약 12kg, 상품 비율 좋음.</div>
          <div class="log-photos">
            <div class="ph"><svg class="ic"><use href="#i-cam"/></svg></div>
          </div>
        </div>
      </div>
    </div>

    <a class="fab" href="ksfarm_diary_write_mo_hybrid.html"><svg class="ic"><use href="#i-plus"/></svg> 일지 쓰기</a>
  </div>

  <script>
    // 2026년 5월: 1일=금요일(요일 index 5), 31일까지
    var year = 2026, month = 5;
    var firstDow = 5; // 금
    var daysInMonth = 31;
    var today = 27;
    var selected = 27;
    var hasLog = { 3:1, 8:1, 12:1, 19:1, 20:1, 24:1, 27:1 }; // 일지 있는 날

    function buildGrid(){
      var grid = document.getElementById('grid');
      var html = '';
      for (var i = 0; i < firstDow; i++) html += '<div class="day empty"></div>';
      for (var d = 1; d <= daysInMonth; d++){
        var dow = (firstDow + d - 1) % 7;
        var cls = 'day';
        if (dow === 0) cls += ' sun';
        if (d === today) cls += ' today';
        if (d === selected) cls += ' on';
        html += '<button class="'+cls+'" data-d="'+d+'">'+d
          + (hasLog[d] ? '<span class="dot"></span>' : '<span style="width:5px;height:5px"></span>')
          + '</button>';
      }
      grid.innerHTML = html;
      grid.querySelectorAll('.day[data-d]').forEach(function(b){
        b.addEventListener('click', function(){
          selected = parseInt(b.dataset.d);
          buildGrid();
        });
      });
    }
    buildGrid();
  </script>
</body>
</html>
