<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 작물 시세</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
    --up: #B0612C; --down: #2F6150;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back, .appbar .act { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .act .ic { font-size: 19px; color: var(--ink-2); }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }

  /* 농장 기준 한 줄 */
  .basis { display: flex; align-items: center; gap: 6px; margin: 6px 2px 4px; font-size: 12.5px; color: var(--gray); font-weight: 600; }
  .basis .ic { font-size: 14px; color: var(--sage); }
  .basis b { color: var(--ink); font-weight: 700; }

  /* 헤드라인 */
  .headline { font-size: 26px; font-weight: 800; letter-spacing: -0.026em; line-height: 1.32; margin: 12px 2px 4px; }
  .headline b { color: var(--green); }
  .head-sub { font-size: 12px; color: var(--gray); font-weight: 600; margin: 0 2px 18px; }

  /* 작물 탭 (밑줄식) */
  .tabs { display: flex; align-items: center; gap: 22px; border-bottom: 1px solid var(--line); margin: 0 0 18px; }
  .tab { padding: 0 2px 11px; font-size: 14.5px; font-weight: 700; color: var(--gray); position: relative; }
  .tab.on { color: var(--ink); font-weight: 800; }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px; background: var(--green); border-radius: 2px; }
  .tab-add { margin-left: auto; margin-bottom: 7px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--field-bg); color: var(--green); }
  .tab-add .ic { font-size: 16px; }

  /* 빈 상태 */
  .empty { text-align: center; padding: 56px 24px 40px; }
  .empty-ill { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
  .empty-ill .ic { font-size: 34px; }
  .empty-t { font-size: 15px; color: var(--ink-2); font-weight: 600; line-height: 1.6; margin-bottom: 24px; }
  .empty-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 14px 26px; border-radius: 12px; background: var(--green); color: #fff; font-size: 14.5px; font-weight: 800; }
  .empty-btn .ic { font-size: 16px; }

  /* 그래프 카드 */
  .chart-card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .cc-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .cc-name { font-size: 13px; color: var(--gray); font-weight: 700; }
  .cc-name b { color: var(--ink); font-weight: 800; font-size: 15px; }
  .cc-price-row { display: flex; align-items: baseline; gap: 9px; }
  .cc-price { font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -0.024em; }
  .cc-pd { font-size: 13.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; }
  .cc-pd.up { color: var(--up); }
  .cc-pd.down { color: var(--down); }
  .cc-pd .arr { font-size: 10px; }
  .spark { margin-top: 14px; height: 104px; position: relative; }
  .spark canvas { width: 100% !important; height: 100% !important; }
  .spark-labels { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 2px; font-size: 10.5px; color: var(--gray); font-weight: 600; }
  .spark-labels .lb.now { color: var(--ink); font-weight: 800; }

  /* 단위/품종별 카드 리스트 */
  .sec-h { font-size: 13px; color: var(--gray); font-weight: 700; margin: 18px 2px 10px; }
  .list { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
  .prow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 18px 18px; }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .pm { flex: 1; min-width: 0; }
  .prow .meta { font-size: 14px; color: var(--ink); font-weight: 700; letter-spacing: -0.012em; }
  .prow .pp-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .prow .pp { font-size: 15px; font-weight: 800; color: var(--ink); }
  .prow .pd { font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 2px; }
  .prow .pd.up { color: var(--up); }
  .prow .pd.down { color: var(--down); }
  .prow .pd .arr { font-size: 9px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-leaf-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">작물 시세</span>
      <span style="width:38px"></span>
    </div>

    <div class="scroll">
      <div class="basis"><svg class="ic"><use href="#i-pin"/></svg> <b>완주 청년농원</b> 기준 · 완주군 · 시설채소</div>
      <h1 class="headline">아직 등록한<br><b>작물이 없어요</b></h1>
      <p class="head-sub">2026.05.27 기준</p>

      <!-- 빈 상태 -->
      <div class="empty">
        <div class="empty-ill"><svg class="ic"><use href="#i-leaf-big"/></svg></div>
        <div class="empty-t">농장 작물을 추가하면<br>도매 시세를 바로 확인할 수 있어요</div>
        <a class="empty-btn" href="ksfarm_farm_mo_hybrid.html"><svg class="ic"><use href="#i-plus"/></svg> 농장 작물 추가하기</a>
      </div>
    </div>
  </div>

</body>
</html>
