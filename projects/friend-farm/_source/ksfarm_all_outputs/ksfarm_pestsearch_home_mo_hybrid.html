<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 병해충 정보</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 0 24px 24px; display: flex; flex-direction: column; }

  /* 검색 히어로 (주인공) */
  .hero { padding-top: 112px; }
  .hero h1 { font-size: 33px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; margin: 0 0 12px; }
  .hero h1 b { color: var(--green); }
  .hero .sub { font-size: 15px; color: var(--gray); font-weight: 500; margin: 0 0 40px; line-height: 1.62; }

  /* 큰 검색창 */
  .searchbar { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; box-shadow: 0 4px 12px -7px rgba(36,30,18,.16), var(--shadow); padding: 15px 16px; border: 1.5px solid transparent; }
  .searchbar .ic { font-size: 20px; color: var(--green); }
  .searchbar input { flex: 1; border: 0; background: none; font-size: 15px; font-weight: 500; color: var(--ink); outline: none; }
  .searchbar input::placeholder { color: var(--gray); font-weight: 500; }

  /* 내 농장 작물 병해충 */
  .myfarm { margin-top: 40px; }
  .myfarm .mf-lbl { font-size: 14px; color: var(--ink); font-weight: 800; letter-spacing: -0.016em; margin: 0 0 13px; }
  .crop-tabs { display: flex; gap: 8px; margin-bottom: 13px; }
  .crop-tab { padding: 8px 17px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .crop-tab.on { background: var(--green); color: #fff; box-shadow: none; }
  .pest-list { display: flex; flex-direction: column; gap: 10px; }
  .pest-item { display: flex; align-items: center; gap: 13px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; }
  .pest-item .thumb { width: 46px; height: 46px; border-radius: 10px; background: linear-gradient(150deg, #DCDACC, #CFCDBC); display: grid; place-items: center; flex-shrink: 0; color: var(--sage); opacity: .55; }
  .pest-item .thumb .ic { font-size: 21px; }
  .pest-item .pm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pest-item .pn { font-size: 14.5px; font-weight: 800; letter-spacing: -0.014em; display: flex; align-items: center; gap: 7px; }
  .pest-item .ptag { font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
  .pest-item .ptag.dis { background: #F2E3D6; color: var(--clay); }
  .pest-item .ptag.pst { background: var(--green-soft); color: var(--green); }
  .pest-item .psci { font-size: 11.5px; color: var(--gray); font-style: italic; margin-top: 3px; font-weight: 500; }
  .pest-item .cv { color: #C7C8BE; font-size: 18px; flex-shrink: 0; }
  .pest-more { width: 100%; height: 46px; margin-top: 10px; border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow); font-size: 13.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; }

  /* 조회 많은 병해충 (검색과 한 묶음 · 보조) */
  .popular { margin-top: 16px; }
  .popular .pop-lbl { font-size: 12.5px; color: var(--gray); font-weight: 700; letter-spacing: -0.012em; margin: 0 0 11px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 7px; }
  .pchip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.55); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .pchip .rk { font-size: 11px; font-weight: 800; color: var(--sage); }
  .pchip .dot { width: 5px; height: 5px; border-radius: 50%; opacity: .65; }
  .pchip .dot.dis { background: var(--clay); }
  .pchip .dot.pst { background: var(--sage); }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">병해충 정보</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <!-- 검색 히어로 -->
      <div class="hero">
        <h1>무슨 병해충인지<br><b>찾아보세요</b></h1>
        <p class="sub">작물 이름이나 병해충 이름으로<br>증상과 방제법을 확인할 수 있어요.</p>
        <a class="searchbar" href="ksfarm_pestsearch_search_mo_hybrid.html">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="text" placeholder="예) 토마토, 탄저병" readonly/>
        </a>
      </div>

      <!-- 조회 많은 병해충 (칩) -->
      <div class="popular">
        <p class="pop-lbl">조회 많은 병해충</p>
        <div class="pchips">
          <a class="pchip" href="ksfarm_pestsearch_search_mo_hybrid.html?q=탄저병"><span class="rk">1</span>탄저병<span class="dot dis"></span></a>
          <a class="pchip" href="ksfarm_pestsearch_search_mo_hybrid.html?q=진딧물"><span class="rk">2</span>진딧물<span class="dot pst"></span></a>
          <a class="pchip" href="ksfarm_pestsearch_search_mo_hybrid.html?q=노균병"><span class="rk">3</span>노균병<span class="dot dis"></span></a>
          <a class="pchip" href="ksfarm_pestsearch_search_mo_hybrid.html?q=총채벌레"><span class="rk">4</span>총채벌레<span class="dot pst"></span></a>
          <a class="pchip" href="ksfarm_pestsearch_search_mo_hybrid.html?q=역병"><span class="rk">5</span>역병<span class="dot dis"></span></a>
        </div>
      </div>

      <!-- 내 농장 작물 병해충 -->
      <div class="myfarm">
        <p class="mf-lbl">내 농장 작물에 조심할 병해충</p>
        <div class="crop-tabs">
          <button class="crop-tab on" data-crop="오이">오이</button>
          <button class="crop-tab" data-crop="딸기">딸기</button>
        </div>
        <div class="pest-list" id="pestList"></div>
        <a class="pest-more" id="pestMore">전체 보기</a>
      </div>
    </div>
  </div>

  <script>
    var DATA = {
      '오이': [
        {nm:'노균병', kind:'dis', sci:'Pseudoperonospora cubensis'},
        {nm:'흰가루병', kind:'dis', sci:'Sphaerotheca fuliginea'},
        {nm:'탄저병', kind:'dis', sci:'Colletotrichum orbiculare'},
        {nm:'총채벌레', kind:'pst', sci:'Frankliniella occidentalis'}
      ],
      '딸기': [
        {nm:'잿빛곰팡이병', kind:'dis', sci:'Botrytis cinerea'},
        {nm:'흰가루병', kind:'dis', sci:'Sphaerotheca aphanis'},
        {nm:'점박이응애', kind:'pst', sci:'Tetranychus urticae'}
      ]
    };
    var SEARCH = 'ksfarm_pestsearch_search_mo_hybrid.html';
    var listEl = document.getElementById('pestList');
    var moreEl = document.getElementById('pestMore');
    var LIMIT = 2;

    function itemHTML(d){
      var tag = d.kind==='dis' ? '<span class="ptag dis">병</span>' : '<span class="ptag pst">해충</span>';
      return '<a class="pest-item" href="'+SEARCH+'?q='+encodeURIComponent(d.nm)+'">'
        + '<span class="thumb"><svg class="ic"><use href="#i-img"/></svg></span>'
        + '<span class="pm"><span class="pn">'+d.nm+' '+tag+'</span><span class="psci">'+d.sci+'</span></span>'
        + '<svg class="ic cv"><use href="#i-cv"/></svg></a>';
    }
    function render(crop){
      var arr = DATA[crop];
      listEl.innerHTML = arr.slice(0, LIMIT).map(itemHTML).join('');
      moreEl.href = SEARCH + '?q=' + encodeURIComponent(crop);
      moreEl.textContent = crop + ' 병해충 전체 보기';
    }
    document.querySelectorAll('.crop-tab').forEach(function(t){
      t.addEventListener('click', function(){
        document.querySelectorAll('.crop-tab').forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        render(t.dataset.crop);
      });
    });
    render('오이');
  </script>
</body>
</html>
