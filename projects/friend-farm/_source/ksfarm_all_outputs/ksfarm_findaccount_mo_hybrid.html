<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 아이디·비밀번호 찾기</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --red: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone { position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 860px; display: flex; flex-direction: column;
   }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  /* tabs */
  .tabs { display: flex; padding: 8px 20px 0; gap: 0; flex-shrink: 0; }
  .tab { flex: 1; text-align: center; padding: 12px 0 13px; font-size: 14.5px; font-weight: 700; color: var(--gray); position: relative; letter-spacing: -0.01em; }
  .tab.on { color: var(--green); font-weight: 800; }
  .tab.on::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 60%; height: 2.5px; border-radius: 999px; background: var(--green); }
  .tabline { height: 1px; background: var(--line); margin: 0 20px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 22px 20px 24px; }
  .lead { font-size: 20px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.36; margin: 0 2px 8px; }
  .lead-sub { font-size: 13.5px; color: var(--gray); margin: 0 2px 24px; line-height: 1.6; font-weight: 500; }

  .field { margin-bottom: 14px; }
  .field .lab { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; padding-left: 2px; letter-spacing: -0.01em; }
  .field .box { display: flex; align-items: center; gap: 8px; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; height: 52px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .field .inp { flex: 1; width: 100%; border: 0; background: transparent; padding: 0; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none; }
  .field .inp::placeholder { color: #ADAFa4; font-weight: 500; }
  .field .box:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }
  .field .box.err { border-color: var(--red, #B0612C); background: var(--card); }
  .err-msg { display: none; font-size: 11.5px; color: var(--red, #B0612C); font-weight: 600; margin: 6px 2px 0; padding-left: 2px; }
  .field.show-err .err-msg { display: block; }
  .field .row2 { display: flex; gap: 8px; }
  .field .row2 .box { flex: 1; }
  .mini { flex: 0 0 auto; padding: 0 16px; height: 52px; border-radius: var(--r-md); background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-submit { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  .hidden { display: none; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">계정 찾기</span>
      <span class="sp"></span>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="id">아이디 찾기</button>
      <button class="tab" data-tab="pw">비밀번호 찾기</button>
    </div>
    <div class="tabline"></div>

    <!-- 아이디 찾기 -->
    <div class="scroll pane-id">
      <h2 class="lead">가입 시 등록한<br>정보로 아이디를 찾아요</h2>
      <p class="lead-sub">본인 확인 후 아이디를 알려드릴게요.</p>

      <div class="field" id="id-name">
        <label class="lab">이름</label>
        <div class="box"><input class="inp" type="text" placeholder="이름" /></div>
        <p class="err-msg">이름을 입력해 주세요.</p>
      </div>
      <div class="field" id="id-email">
        <label class="lab">이메일</label>
        <div class="row2">
          <div class="box"><input class="inp" type="email" placeholder="가입한 이메일" /></div>
          <button class="mini" data-req-email="id-email,id-name">인증요청</button>
        </div>
        <p class="err-msg">올바른 이메일 형식을 입력해 주세요.</p>
      </div>
      <div class="field">
        <label class="lab">인증번호</label>
        <div class="row2">
          <div class="box"><input class="inp" type="number" placeholder="인증번호 6자리" /></div>
          <button class="mini">확인</button>
        </div>
      </div>
    </div>

    <!-- 비밀번호 찾기 -->
    <div class="scroll pane-pw hidden">
      <h2 class="lead">본인 확인 후<br>비밀번호를 재설정해요</h2>
      <p class="lead-sub">가입한 아이디와 이메일로 본인 확인해요.</p>

      <div class="field" id="pw-id">
        <label class="lab">아이디</label>
        <div class="box"><input class="inp" type="text" placeholder="아이디" /></div>
        <p class="err-msg">아이디를 입력해 주세요.</p>
      </div>
      <div class="field" id="pw-email">
        <label class="lab">이메일</label>
        <div class="row2">
          <div class="box"><input class="inp" type="email" placeholder="가입한 이메일" /></div>
          <button class="mini" data-req-email="pw-email,pw-id">인증요청</button>
        </div>
        <p class="err-msg">올바른 이메일 형식을 입력해 주세요.</p>
      </div>
      <div class="field">
        <label class="lab">인증번호</label>
        <div class="row2">
          <div class="box"><input class="inp" type="number" placeholder="인증번호 6자리" /></div>
          <button class="mini">확인</button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="btn-submit" id="submitBtn">아이디 찾기</button>
    </div>
  </div>

  <script>
    var tabs = document.querySelectorAll('.tab');
    var paneId = document.querySelector('.pane-id');
    var panePw = document.querySelector('.pane-pw');
    var submitBtn = document.getElementById('submitBtn');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){
        tabs.forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        var isId = t.dataset.tab === 'id';
        paneId.classList.toggle('hidden', !isId);
        panePw.classList.toggle('hidden', isId);
        submitBtn.textContent = isId ? '아이디 찾기' : '다음';
      });
    });

    // 유효성 검사 (인증요청 시)
    var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function setErr(id, on){
      var f = document.getElementById(id);
      f.classList.toggle('show-err', on);
      f.querySelector('.box').classList.toggle('err', on);
    }
    document.querySelectorAll('[data-req-email]').forEach(function(btn){
      var ids = btn.getAttribute('data-req-email').split(',');
      var emailId = ids[0], prevId = ids[1];
      btn.addEventListener('click', function(){
        // 앞 필수 필드(이름/아이디) 빈 값 검사
        var prev = document.getElementById(prevId);
        var prevVal = prev.querySelector('.inp').value.trim();
        setErr(prevId, prevVal === '');
        // 이메일 형식 검사
        var emailVal = document.getElementById(emailId).querySelector('.inp').value.trim();
        setErr(emailId, !emailRe.test(emailVal));
      });
    });
    // 입력 시 에러 해제
    document.querySelectorAll('.field .inp').forEach(function(inp){
      inp.addEventListener('input', function(){
        var f = inp.closest('.field');
        if (f && f.classList.contains('show-err')) {
          f.classList.remove('show-err');
          f.querySelector('.box').classList.remove('err');
        }
      });
    });
  </script>
</body>
</html>
