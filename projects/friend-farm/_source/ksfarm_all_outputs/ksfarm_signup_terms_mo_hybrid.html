<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 약관 동의</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone { position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 860px; display: flex; flex-direction: column;
   }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  /* progress */
  .progress { padding: 6px 20px 0; flex-shrink: 0; }
  .progress .bar { height: 4px; border-radius: 999px; background: rgba(48,42,30,.1); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 50%; background: var(--green); border-radius: 999px; }
  .progress .step { font-size: 11.5px; color: var(--gray); font-weight: 700; margin-top: 7px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  .lead { font-size: 22px; font-weight: 800; letter-spacing: -0.024em; line-height: 1.34; margin: 4px 2px 8px; }
  .lead-sub { font-size: 14px; color: var(--gray); margin: 0 2px 24px; line-height: 1.6; font-weight: 500; }

  /* all agree */
  .ag-all { display: flex; align-items: center; gap: 13px; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 16px; margin-bottom: 12px; }
  .ag-all .t { flex: 1; font-size: 16px; font-weight: 800; letter-spacing: -0.018em; }
  .ag-all .t .d { display: block; font-size: 12px; color: var(--gray); font-weight: 500; margin-top: 3px; }

  .ag-list { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 4px 16px; }
  .ag-row { display: flex; align-items: center; gap: 13px; padding: 15px 0; }
  .ag-row + .ag-row { border-top: 1px solid var(--line); }
  .ag-row .t { flex: 1; font-size: 14.5px; font-weight: 500; color: var(--ink); letter-spacing: -0.012em; }
  .ag-row .t .req { color: var(--green); font-weight: 700; }
  .ag-row .t .opt { color: var(--gray); font-weight: 700; }
  .ag-row .view { font-size: 13px; color: #9DA095; flex-shrink: 0; }

  .chk { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; display: grid; place-items: center; background: #E2E1D7; color: #fff; transition: background .12s; }
  .chk.on { background: var(--green); }
  .chk .ic { font-size: 14px; }
  .ag-all .chk { width: 28px; height: 28px; flex: 0 0 28px; }
  .ag-all .chk .ic { font-size: 16px; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-next { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5);
    transition: opacity .15s; }
  .btn-next:disabled { opacity: .4; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">약관 동의</span>
      <span class="sp"></span>
    </div>

    <div class="progress">
      <div class="bar"><i></i></div>
      <div class="step">1 / 2 단계 · 약관 동의</div>
    </div>

    <div class="scroll">
      <h2 class="lead">약관에 동의해 주세요</h2>
      <p class="lead-sub">농사친구 서비스를 이용하려면<br>아래 약관 동의가 필요해요.</p>

      <div class="ag-all">
        <button class="chk" id="agAll" aria-label="전체 동의"><svg class="ic"><use href="#i-check"/></svg></button>
        <span class="t">약관 전체 동의<span class="d">필수·선택 약관에 모두 동의합니다</span></span>
      </div>

      <div class="ag-list">
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 서비스 이용약관</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 개인정보 처리방침</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="1"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="req">[필수]</span> 위치기반 서비스 이용약관</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
        <div class="ag-row">
          <button class="chk ag-item" data-req="0"><svg class="ic"><use href="#i-check"/></svg></button>
          <span class="t"><span class="opt">[선택]</span> 마케팅 정보 수신 동의</span>
          <a class="view" href="#"><svg class="ic"><use href="#i-cv"/></svg></a>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="btn-next" id="next" disabled>동의하고 계속하기</button>
    </div>
  </div>

  <script>
    var agAll = document.getElementById('agAll');
    var items = Array.from(document.querySelectorAll('.ag-item'));
    var next = document.getElementById('next');
    function refresh() {
      agAll.classList.toggle('on', items.every(function(i){ return i.classList.contains('on'); }));
      var reqOk = items.filter(function(i){ return i.dataset.req === '1'; }).every(function(i){ return i.classList.contains('on'); });
      next.disabled = !reqOk;
    }
    agAll.addEventListener('click', function(){
      var on = !agAll.classList.contains('on');
      items.forEach(function(i){ i.classList.toggle('on', on); });
      refresh();
    });
    items.forEach(function(i){ i.addEventListener('click', function(){ i.classList.toggle('on'); refresh(); }); });
  </script>
</body>
</html>
