<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 질문하기</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, textarea { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { overflow-x: hidden; flex: 1; overflow-y: auto; padding: 8px 20px 24px; }

  .field { margin-bottom: 20px; }
  .field .lab { display: block; font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 10px; padding-left: 2px; letter-spacing: -0.012em; }
  .field .lab .req { color: var(--clay); }

  /* 카테고리 선택 칩 */
  .cat-pick { display: flex; flex-wrap: wrap; gap: 7px; }
  .cat-pick button { padding: 9px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .cat-pick button.on { background: var(--green); color: #fff; box-shadow: none; }

  /* 인풋 */
  .box { display: flex; align-items: center; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; height: 52px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .box input { flex: 1; width: 100%; border: 0; background: transparent; font-size: 15.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none; }
  .box input::placeholder { color: #ADAFa4; font-weight: 500; }
  .box:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }

  .textarea-wrap { background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 14px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .textarea-wrap:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }
  .textarea-wrap textarea { width: 100%; border: 0; background: transparent; font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1.6; outline: none; resize: none; min-height: 130px; }
  .textarea-wrap textarea::placeholder { color: #ADAFa4; }
  .char-count { text-align: right; font-size: 11.5px; color: var(--gray); font-weight: 600; margin-top: 8px; }

  /* 사진 첨부 */
  .photo-help { font-size: 12px; color: var(--gray); margin: 0 2px 12px; line-height: 1.5; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-tile { width: 64px; height: 64px; flex: 0 0 auto; border-radius: 12px; background: var(--field-bg); border: 1.5px dashed rgba(31,75,60,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--green); }
  .add-tile .ic { font-size: 19px; }
  .add-tile .cnt { font-size: 9.5px; font-weight: 700; color: var(--gray); }
  .pthumb { position: relative; width: 64px; height: 64px; flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: linear-gradient(155deg, #3A6B57, var(--green) 65%, var(--green-2)); }
  .pthumb .x { position: absolute; top: 3px; right: 3px; width: 17px; height: 17px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
  .pthumb .x .ic { font-size: 9px; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-submit { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  /* 완료 모달 */
  .modal-scrim { position: absolute; inset: 0; background: rgba(24,20,12,.5); z-index: 30; border-radius: 30px; overflow: hidden; display: grid; place-items: center; padding: 0 32px;
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
  .modal-scrim.show { opacity: 1; visibility: visible; }
  .modal { width: 100%; max-width: 320px; background: var(--card); border-radius: 22px; padding: 30px 24px 20px; text-align: center;
    transform: scale(.92); transition: transform .28s cubic-bezier(.22,1,.36,1); }
  .modal-scrim.show .modal { transform: scale(1); }
  .modal-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; margin: 0 auto 16px; }
  .modal-ic .ic { font-size: 34px; }
  .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .modal-desc { font-size: 13.5px; color: var(--gray); line-height: 1.6; margin-top: 10px; font-weight: 500; }
  .modal-btn { width: 100%; height: 52px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; margin-top: 22px;
    background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
    <symbol id="i-check-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">질문하기</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <!-- 카테고리 -->
      <div class="field">
        <label class="lab">분야 선택 <span class="req">*</span></label>
        <div class="cat-pick">
          <button class="on" data-cat>스마트팜</button>
          <button data-cat>가공</button>
          <button data-cat>유통</button>
          <button data-cat>운영</button>
          <button data-cat>기타</button>
        </div>
      </div>

      <!-- 제목 -->
      <div class="field">
        <label class="lab">제목 <span class="req">*</span></label>
        <div class="box"><input type="text" placeholder="질문을 한 줄로 요약해 주세요" /></div>
      </div>

      <!-- 내용 -->
      <div class="field">
        <label class="lab">내용 <span class="req">*</span></label>
        <div class="textarea-wrap">
          <textarea id="content" maxlength="1000" placeholder="작물·재배환경·증상 등 상황을 자세히 적어주실수록 정확한 답변을 받을 수 있어요."></textarea>
        </div>
        <div class="char-count"><span id="cc">0</span> / 1000</div>
      </div>

      <!-- 사진 -->
      <div class="field">
        <label class="lab">사진 첨부 (선택)</label>
        <p class="photo-help">작물 상태가 보이는 사진을 올리면 답변에 큰 도움이 돼요.</p>
        <div class="photo-row" id="photoRow">
          <button class="add-tile" id="addTile">
            <svg class="ic"><use href="#i-camera"/></svg>
            <span class="cnt">0 / 3</span>
          </button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="btn-submit" id="submitBtn">질문 등록</button>
    </div>

    <!-- 등록 완료 모달 -->
    <div class="modal-scrim" id="doneModal">
      <div class="modal">
        <div class="modal-ic"><svg class="ic"><use href="#i-check-c"/></svg></div>
        <div class="modal-title">질문이 등록되었어요</div>
        <div class="modal-desc">분야별 전문가가 확인한 뒤<br>답변을 드릴게요.</div>
        <button class="modal-btn" id="doneOk">확인</button>
      </div>
    </div>
  </div>

  <script>
    // 카테고리 단일 선택
    document.querySelectorAll('[data-cat]').forEach(function(c){
      c.addEventListener('click', function(){
        document.querySelectorAll('[data-cat]').forEach(function(x){ x.classList.remove('on'); });
        c.classList.add('on');
      });
    });
    // 글자수
    var ta = document.getElementById('content');
    var cc = document.getElementById('cc');
    ta.addEventListener('input', function(){ cc.textContent = ta.value.length; });
    // 사진 추가 (데모: 더미 썸네일)
    var photoRow = document.getElementById('photoRow');
    var addTile = document.getElementById('addTile');
    function photoCount(){ return photoRow.querySelectorAll('.pthumb').length; }
    function updateTile(){ addTile.querySelector('.cnt').textContent = photoCount() + ' / 3'; addTile.style.display = photoCount() >= 3 ? 'none' : ''; }
    addTile.addEventListener('click', function(){
      if (photoCount() >= 3) return;
      var t = document.createElement('div');
      t.className = 'pthumb';
      t.innerHTML = '<button class="x"><svg class="ic"><use href="#i-x"/></svg></button>';
      t.querySelector('.x').addEventListener('click', function(){ t.remove(); updateTile(); });
      photoRow.appendChild(t);
      updateTile();
    });
    // 등록 → 완료 모달
    document.getElementById('submitBtn').addEventListener('click', function(){
      document.getElementById('doneModal').classList.add('show');
    });
    document.getElementById('doneOk').addEventListener('click', function(){
      document.getElementById('doneModal').classList.remove('show');
    });
  </script>
</body>
</html>
