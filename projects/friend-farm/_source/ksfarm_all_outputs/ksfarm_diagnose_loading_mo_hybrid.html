<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — AI 진단 중</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; font-family: inherit; }
  h1,h2,h3,p,span { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: linear-gradient(180deg, #1F4B3C 0%, #143028 100%);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
    color: #fff;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; color: #fff; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 28px; position: relative; }

  /* 스캔 원형 일러스트 */
  .scan-ring { width: 168px; height: 168px; border-radius: 50%; position: relative; margin-bottom: 44px; display: grid; place-items: center; }
  .scan-ring::before, .scan-ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.16); animation: pulse 2.2s ease-out infinite; }
  .scan-ring::after { animation-delay: 1.1s; }
  @keyframes pulse {
    0% { transform: scale(.85); opacity: .7; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .scan-core { width: 92px; height: 92px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.22); display: grid; place-items: center; color: #fff; backdrop-filter: blur(8px); }
  .scan-core .ic { font-size: 38px; }
  .scan-orbit { position: absolute; inset: 18px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.2); animation: rot 8s linear infinite; }
  .scan-orbit .dot { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff; }
  @keyframes rot { to { transform: rotate(360deg); } }

  h1 { font-size: 24px; font-weight: 800; margin: 0 0 9px; letter-spacing: -.022em; text-align: center; }
  .sub { font-size: 13.5px; color: #B9D2C6; font-weight: 600; margin: 0 0 48px; text-align: center; line-height: 1.55; }

  /* 진단 단계 */
  .steps { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .stp { display: flex; align-items: center; gap: 13px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); transition: all .35s; }
  .stp .sdot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); display: grid; place-items: center; color: rgba(255,255,255,.55); flex-shrink: 0; font-size: 11px; font-weight: 800; }
  .stp .stext { flex: 1; font-size: 14px; font-weight: 700; color: rgba(255,255,255,.6); }
  .stp.done .sdot { background: #fff; border-color: #fff; color: var(--green); }
  .stp.done .sdot .ic { font-size: 13px; }
  .stp.done .stext { color: rgba(255,255,255,.9); }
  .stp.on { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); }
  .stp.on .sdot { border-color: #fff; color: #fff; }
  .stp.on .stext { color: #fff; font-weight: 800; }
  .stp.on .sdot .spinner { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skip-bar { padding: 16px 22px calc(20px + env(safe-area-inset-bottom)); text-align: center; }
  .skip { font-size: 12.5px; color: rgba(255,255,255,.55); font-weight: 600; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-batt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-batt"/></svg></span>
    </div>

    <div class="content">
      <div class="scan-ring">
        <div class="scan-orbit"><span class="dot"></span></div>
        <div class="scan-core"><svg class="ic"><use href="#i-scan"/></svg></div>
      </div>
      <h1>AI가 진단 중이에요</h1>
      <p class="sub">잠시만 기다려주세요<br>증상을 분석하고 있어요</p>
      <div class="steps">
        <div class="stp done"><span class="sdot"><svg class="ic"><use href="#i-check"/></svg></span><span class="stext">작물 정보 확인</span></div>
        <div class="stp done"><span class="sdot"><svg class="ic"><use href="#i-check"/></svg></span><span class="stext">증상·부위 분석</span></div>
        <div class="stp on"><span class="sdot"><span class="spinner"></span></span><span class="stext">사진 영상 분석</span></div>
      </div>
    </div>

    <div class="skip-bar">
      <span class="skip">평균 5~10초 정도 걸려요</span>
    </div>
  </div>
</body>
</html>
