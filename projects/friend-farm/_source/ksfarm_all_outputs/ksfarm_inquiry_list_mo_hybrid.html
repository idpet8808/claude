<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 1:1 문의 내역</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --gold: #B08A3E;
    --gray-soft: #EDEEE9;
    --r-lg: 18px; --r-md: 14px;
    --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,strong { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 20px 100px; }

  /* 상태 필터 */
  .filter { display: flex; gap: 8px; padding: 4px 0 16px; }
  .f-chip {
    height: 34px; padding: 0 15px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-2);
    font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
    display: inline-flex; align-items: center; gap: 5px; transition: all .12s;
  }
  .f-chip .cnt { font-size: 12px; color: var(--gray); font-weight: 700; }
  .f-chip.on { background: var(--green); border-color: var(--green); color: #fff; }
  .f-chip.on .cnt { color: rgba(255,255,255,.7); }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block; background: var(--card); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: 16px 17px; width: 100%; text-align: left;
  }
  .card:active { transform: scale(.99); }
  .c-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .status { font-size: 11.5px; font-weight: 800; letter-spacing: -0.01em; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .status.done { color: var(--green); background: var(--green-soft); }
  .status.wait { color: var(--gray); background: var(--gray-soft); }
  .status .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
  .c-date { font-size: 12px; color: var(--gray); font-weight: 500; }
  .c-title { font-size: 15px; font-weight: 700; letter-spacing: -0.016em; color: var(--ink); line-height: 1.4; }
  .c-preview { margin-top: 6px; font-size: 13px; color: var(--gray); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }

  /* empty state (참고) — 주석 처리된 대안 */

  /* floating write button */
  .fab {
    position: absolute; left: 20px; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    height: 54px; border-radius: var(--r-md); color: #fff;
    font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -8px rgba(22,55,41,.55);
  }
  .fab .ic { font-size: 18px; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">1:1 문의 내역</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <div class="filter">
        <button class="f-chip on" data-filter="all">전체</button>
        <button class="f-chip" data-filter="wait">답변 대기</button>
        <button class="f-chip" data-filter="done">답변 완료</button>
      </div>
      <div class="list">

        <a class="card" href="#" data-status="done">
          <div class="c-top">
            <span class="status done"><span class="dot"></span>답변 완료</span>
            <span class="c-date">2026.05.20</span>
          </div>
          <div class="c-title">진단 결과가 실제와 다른 것 같아요</div>
          <div class="c-preview">오이 잎 사진을 올렸는데 진단된 병해가 제가 보기엔…</div>
        </a>

        <a class="card" href="#" data-status="wait">
          <div class="c-top">
            <span class="status wait"><span class="dot"></span>답변 대기</span>
            <span class="c-date">2026.05.18</span>
          </div>
          <div class="c-title">휴대폰 번호를 바꿨는데 인증이 안 돼요</div>
          <div class="c-preview">기기를 변경한 뒤로 본인인증 단계에서 계속 막혀서…</div>
        </a>

        <a class="card" href="#" data-status="done">
          <div class="c-top">
            <span class="status done"><span class="dot"></span>답변 완료</span>
            <span class="c-date">2026.05.11</span>
          </div>
          <div class="c-title">영농일지 작성 중 사진이 안 올라가요</div>
          <div class="c-preview">갤러리에서 사진을 선택하면 한참 로딩만 되고…</div>
        </a>

      </div>
    </div>

    <button class="fab"><svg class="ic"><use href="#i-plus"/></svg> 문의하기</button>
  </div>

  <script>
    var chips = document.querySelectorAll('.f-chip');
    var cards = document.querySelectorAll('.card');
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        chips.forEach(function(c){ c.classList.remove('on'); });
        chip.classList.add('on');
        var f = chip.getAttribute('data-filter');
        cards.forEach(function(card){
          var st = card.getAttribute('data-status');
          card.style.display = (f === 'all' || f === st) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
