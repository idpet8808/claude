<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 농장 정보 조회</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150;
    --gold: #B08A3E;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,strong { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 22px 100px; }
  .count-row { padding: 12px 2px 6px; }
  .count-row .t { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.024em; }
  .count-row .n { display: block; font-size: 13px; font-weight: 600; color: var(--gray); margin-top: 5px; }

  .farm-list { display: flex; flex-direction: column; }

  .farm { display: flex; gap: 14px; align-items: center; padding: 20px 2px; width: 100%; text-align: left; position: relative; }
  .farm + .farm { border-top: 1px solid var(--line); }

  .f-thumb { flex: 0 0 54px; width: 54px; height: 54px; border-radius: 13px; overflow: hidden; background: linear-gradient(155deg, #3A6B57, var(--green) 65%, var(--green-2)); }
  .f-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .f-thumb.empty { position: relative; display: grid; place-items: center; background: linear-gradient(155deg, #3A6B57, var(--green) 70%, var(--green-2)); color: rgba(255,255,255,.92); }
  .f-thumb.empty .leaf-bg { position: absolute; inset: 0; opacity: .14; overflow: hidden; }
  .f-thumb.empty .leaf-bg svg { position: absolute; width: 46px; height: 46px; right: -8px; bottom: -8px; color: #fff; }
  .f-thumb.empty .ic { font-size: 25px; position: relative; }

  .f-main { flex: 1; min-width: 0; }
  .f-top { display: flex; align-items: center; gap: 7px; }
  .f-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .f-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
  .f-sub { font-size: 13px; color: var(--gray); font-weight: 500; margin-top: 6px; letter-spacing: -0.01em; line-height: 1.45; }

  .f-cv { color: #C2C3BA; font-size: 18px; align-self: center; flex-shrink: 0; }

  .fab { position: absolute; left: 20px; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); height: 54px; border-radius: var(--r-md); color: #fff;
    font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -8px rgba(22,55,41,.55); }
  .fab .ic { font-size: 18px; }

  /* === 360px safety net (v3) === */
  .phone img, .phone svg { max-width: 100%; height: auto; }
  .phone { word-break: keep-all; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-farm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l9-6 9 6v11"/><path d="M3 21h18"/><path d="M9 21v-6h6v6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-leaf-f" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">농장 정보 조회</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <div class="count-row">
        <span class="t">내 농장</span>
        <span class="n">2곳 등록 · 최대 10곳</span>
      </div>

      <div class="farm-list">
        <!-- 대표 농장 (사진 있음) -->
        <a class="farm" href="#">
          <div class="f-thumb">
            <img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?w=300&q=80" alt="농장 사진" onerror="this.parentElement.classList.add('empty');this.remove();"/>
          </div>
          <div class="f-main">
            <div class="f-top"><span class="f-name">강남 역삼 농원</span><span class="f-badge">대표</span></div>
            <div class="f-sub">서울특별시 종로구 · 오이 (백다다기) · 토경재배</div>
          </div>
          <svg class="ic f-cv"><use href="#i-cv"/></svg>
        </a>

        <!-- 일반 농장 (사진 없음) -->
        <a class="farm" href="#">
          <div class="f-thumb empty"><span class="leaf-bg"><svg viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg></span><svg class="ic"><use href="#i-leaf"/></svg></div>
          <div class="f-main">
            <div class="f-top"><span class="f-name">양평 비닐하우스</span></div>
            <div class="f-sub">경기도 양평군 · 토마토 (대저) · 수경재배</div>
          </div>
          <svg class="ic f-cv"><use href="#i-cv"/></svg>
        </a>
      </div>
    </div>

    <button class="fab"><svg class="ic"><use href="#i-plus"/></svg> 농장 등록</button>
  </div>
</body>
</html>
