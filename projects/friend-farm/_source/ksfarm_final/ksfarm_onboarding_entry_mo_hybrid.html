<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 시작하기</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.12);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 820px; display: flex; flex-direction: column;
    position: relative;
  }

  /* 배경 잎 모티프 (아주 옅게) */
  .bg-motif { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-motif svg { position: absolute; opacity: .05; color: var(--green); }
  .bg-motif .m1 { width: 320px; height: 320px; top: -70px; right: -100px; }
  .bg-motif .m2 { width: 260px; height: 260px; bottom: 150px; left: -110px; color: var(--sage, #2F6150); }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; position: relative; z-index: 1; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .body { flex: 1; display: flex; flex-direction: column; padding: 0 28px 30px; position: relative; z-index: 1; }

  /* hero */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(160deg, #2C6150, var(--green)); display: grid; place-items: center; color: #fff; margin-bottom: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 14px 28px -8px rgba(22,55,41,.5); }
  .logo .ic { font-size: 44px; }
  .headline { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
  .headline .hl { color: var(--green); }
  .sub { font-size: 14.5px; color: var(--gray); margin-top: 13px; line-height: 1.6; font-weight: 500; }

  /* auth */
  .auth { flex-shrink: 0; }
  .btn { width: 100%; height: 54px; border-radius: var(--r-md); font-size: 15px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 10px; position: relative; }
  .btn .bi { position: absolute; left: 18px; width: 20px; height: 20px; display: grid; place-items: center; }
  .btn .bi .ic { font-size: 18px; }
  .btn:active { transform: scale(.99); }

  .btn-primary { background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }
  .btn-kakao { background: #FEE500; color: #3C1E1E; box-shadow: 0 6px 14px -6px rgba(254,229,0,.6); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0 16px; color: var(--gray); font-size: 12px; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .icon-row { display: flex; justify-content: center; gap: 16px; }
  .icon-btn { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn .ic { font-size: 23px; }
  .icon-btn.naver { background: #03C75A; border-color: transparent; color: #fff; }
  .icon-btn.apple { background: #111; border-color: transparent; color: #fff; }

  .foot { text-align: center; font-size: 13.5px; color: var(--gray); margin-top: 26px; font-weight: 500; }
  .foot a { color: var(--green); font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-leaf-f" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7-.2.7-.7 2.5-.8 2.9 0 .2.1.4.4.2.3-.2 3-2 4.2-2.8.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12.5c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.8 5.2c.6-.8 1-1.9.9-3-1 0-2.1.7-2.8 1.5-.6.7-1.1 1.8-.9 2.8 1.1.1 2.2-.5 2.8-1.3z"/></symbol>
    <symbol id="i-naver" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h4.6l4.8 7.2V4H19v16h-4.6L9.6 12.8V20H5z"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.6-.1-1.3-.2-1.9H12v3.6h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6C4.7 19.9 8.1 22 12 22z"/><path fill="#FBBC05" d="M6.4 13.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.3H3.1C2.4 8.7 2 10.3 2 12s.4 3.3 1.1 4.7l3.3-2.6z"/><path fill="#EA4335" d="M12 6.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.5 14.7 2.6 12 2.6 8.1 2.6 4.7 4.7 3.1 7.9l3.3 2.6C7.2 8.1 9.4 6.4 12 6.4z"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="bg-motif" aria-hidden="true">
      <svg class="m1" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg>
      <svg class="m2" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg>
    </div>
    <div class="status-bar">
      <span>9:41</span>
      <span class="group">●●●</span>
    </div>

    <div class="body">
      <div class="hero">
        <div class="logo"><svg class="ic"><use href="#i-leaf"/></svg></div>
        <h1 class="headline">농사를 더 쉽게,<br><span class="hl">더 똑똑하게</span></h1>
        <p class="sub">일지 작성, 작물 정보, 대화형 AI까지<br>하나로 관리해 보세요</p>
      </div>

      <div class="auth">
        <button class="btn btn-primary"><span class="bi"><svg class="ic"><use href="#i-mail"/></svg></span>이메일로 시작하기</button>
        <button class="btn btn-kakao"><span class="bi"><svg class="ic"><use href="#i-chat"/></svg></span>카카오로 시작하기</button>

        <div class="divider">간편 로그인</div>

        <div class="icon-row">
          <button class="icon-btn naver" aria-label="네이버로 시작하기"><svg class="ic"><use href="#i-naver"/></svg></button>
          <button class="icon-btn apple" aria-label="Apple로 시작하기"><svg class="ic"><use href="#i-apple"/></svg></button>
          <button class="icon-btn" aria-label="Google로 시작하기"><svg class="ic"><use href="#i-google"/></svg></button>
        </div>

        <div class="foot">이미 계정이 있으신가요? <a href="#">로그인</a></div>
      </div>
    </div>
  </div>
</body>
</html>
