<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 로그인</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.12); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 820px; display: flex; flex-direction: column;
    position: relative;
  }
  .bg-motif { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-motif svg { position: absolute; opacity: .05; color: var(--green); }
  .bg-motif .m1 { width: 300px; height: 300px; top: -60px; right: -90px; }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; position: relative; z-index: 1; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; position: relative; z-index: 1; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }

  .body { flex: 1; display: flex; flex-direction: column; padding: 0 28px 30px; position: relative; z-index: 1; }

  .head { text-align: center; padding: 30px 0 34px; }
  .logo { width: 66px; height: 66px; border-radius: 21px; background: linear-gradient(160deg, #2C6150, var(--green)); display: grid; place-items: center; color: #fff; margin: 0 auto 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 24px -8px rgba(22,55,41,.5); }
  .logo .ic { font-size: 34px; }
  .head .t { font-size: 22px; font-weight: 800; letter-spacing: -0.024em; }
  .head .s { font-size: 14px; color: var(--gray); margin-top: 9px; font-weight: 500; }

  .field { margin-bottom: 12px; }
  .field .box { display: flex; align-items: center; gap: 8px; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 16px; height: 54px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .field .inp { flex: 1; width: 100%; border: 0; background: transparent; padding: 0; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none; }
  .field .inp::placeholder { color: #ADAFa4; font-weight: 500; }
  .field .box:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }
  .eye { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--gray); flex: 0 0 26px; }
  .eye .ic { font-size: 18px; }

  .btn-login { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; margin-top: 8px;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  .links { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; font-size: 13px; color: var(--gray); font-weight: 600; }
  .links .sep { width: 1px; height: 11px; background: var(--line); }
  .links a { color: var(--ink-2); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 26px 0 18px; color: var(--gray); font-size: 12px; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .icon-row { display: flex; justify-content: center; gap: 16px; }
  .icon-btn { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .icon-btn .ic { font-size: 22px; }
  .icon-btn.kakao { background: #FEE500; border-color: transparent; color: #3C1E1E; }
  .icon-btn.naver { background: #03C75A; border-color: transparent; color: #fff; }
  .icon-btn.apple { background: #111; border-color: transparent; color: #fff; }

  .signup-foot { text-align: center; font-size: 13.5px; color: var(--gray); margin-top: auto; padding-top: 26px; font-weight: 500; }
  .signup-foot a { color: var(--green); font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-leaf-f" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.1A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3 3.7M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7a9.5 9.5 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><line x1="3" y1="3" x2="21" y2="21"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7-.2.7-.7 2.5-.8 2.9 0 .2.1.4.4.2.3-.2 3-2 4.2-2.8.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></symbol>
    <symbol id="i-naver" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h4.6l4.8 7.2V4H19v16h-4.6L9.6 12.8V20H5z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12.5c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8z"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.6-.1-1.3-.2-1.9H12v3.6h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6C4.7 19.9 8.1 22 12 22z"/><path fill="#FBBC05" d="M6.4 13.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.3H3.1C2.4 8.7 2 10.3 2 12s.4 3.3 1.1 4.7l3.3-2.6z"/><path fill="#EA4335" d="M12 6.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.5 14.7 2.6 12 2.6 8.1 2.6 4.7 4.7 3.1 7.9l3.3 2.6C7.2 8.1 9.4 6.4 12 6.4z"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="bg-motif" aria-hidden="true"><svg class="m1" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg></div>

    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
    </div>

    <div class="body">
      <div class="head">
        <div class="logo"><svg class="ic"><use href="#i-leaf"/></svg></div>
        <div class="t">다시 오신 걸 환영해요</div>
        <div class="s">농사친구 계정으로 로그인하세요</div>
      </div>

      <div class="field">
        <div class="box"><input class="inp" type="text" placeholder="아이디" /></div>
      </div>
      <div class="field">
        <div class="box"><input class="inp" type="password" placeholder="비밀번호" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <button class="btn-login">로그인</button>

      <div class="links">
        <a href="#">아이디 찾기</a>
        <span class="sep"></span>
        <a href="#">비밀번호 찾기</a>
      </div>

      <div class="divider">간편 로그인</div>
      <div class="icon-row">
        <button class="icon-btn kakao" aria-label="카카오 로그인"><svg class="ic"><use href="#i-chat"/></svg></button>
        <button class="icon-btn naver" aria-label="네이버 로그인"><svg class="ic"><use href="#i-naver"/></svg></button>
        <button class="icon-btn apple" aria-label="Apple 로그인"><svg class="ic"><use href="#i-apple"/></svg></button>
        <button class="icon-btn" aria-label="Google 로그인"><svg class="ic"><use href="#i-google"/></svg></button>
      </div>

      <div class="signup-foot">아직 회원이 아니신가요? <a href="#">회원가입</a></div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.eye').forEach(function(btn){
      btn.addEventListener('click', function(){
        var inp = btn.parentElement.querySelector('.inp');
        var use = btn.querySelector('use');
        if (inp.type === 'password') { inp.type = 'text'; use.setAttribute('href', '#i-eye-off'); }
        else { inp.type = 'password'; use.setAttribute('href', '#i-eye'); }
      });
    });
  </script>
</body>
</html>
