<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 추가 질문</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .rt { width: 38px; }

  /* 진행 인디케이터 (N/N) */
  .qprog { padding: 18px 24px 8px; flex-shrink: 0; }
  .qprog .qpinfo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .qprog .qplabel { font-size: 12px; font-weight: 800; color: var(--sage); letter-spacing: .04em; }
  .qprog .qpcount { font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .qprog .qpcount b { color: var(--green); }
  .qprog .qpbar { height: 5px; border-radius: 3px; background: #D6D3C7; position: relative; overflow: hidden; }
  .qprog .qpfill { position: absolute; inset: 0; background: var(--green); transform-origin: left; transform: scaleX(0.4); transition: transform .35s cubic-bezier(.4,0,.2,1); border-radius: 3px; }

  .scroll { flex: 1; overflow-y: auto; padding: 30px 22px 24px; display: flex; flex-direction: column; }

  /* AI 안내 카드 */
  .ai-intro { display: flex; gap: 11px; padding: 14px 16px; border-radius: 14px; background: var(--green-soft); border: 1px solid rgba(31,75,60,.12); margin-bottom: 28px; }
  .ai-intro .av { width: 36px; height: 36px; border-radius: 10px; background: var(--green); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .ai-intro .av .ic { font-size: 18px; }
  .ai-intro .at { flex: 1; }
  .ai-intro .at b { display: block; font-size: 13px; font-weight: 800; color: var(--green); margin-bottom: 3px; }
  .ai-intro .at p { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin: 0; line-height: 1.5; }

  /* 큰 질문 */
  .bigq { font-size: 26px; font-weight: 800; line-height: 1.28; letter-spacing: -0.025em; margin: 0 0 11px; }
  .bigsub { font-size: 14px; color: var(--ink-2); font-weight: 600; margin: 0 0 30px; line-height: 1.55; }

  /* 예/아니오 답 (진단 입력의 .ans 패턴 일관) */
  .yesno { display: flex; flex-direction: column; gap: 10px; }
  .ans { display: flex; align-items: center; gap: 14px; padding: 17px 18px; border-radius: 15px; background: var(--card); box-shadow: var(--shadow); border: 1.5px solid transparent; font-size: 15.5px; font-weight: 700; color: var(--ink); transition: all .15s; }
  .ans .arrow { margin-left: auto; color: #C7C8BE; font-size: 16px; }
  .ans.on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 800; }
  .ans.on .arrow { color: var(--green); }

  /* 하단 버튼 */
  .footer { flex-shrink: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .btn { height: 54px; border-radius: 15px; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn-ghost { flex: 0 0 30%; background: var(--field-bg); color: var(--ink-2); }
  .btn-next { flex: 1; background: var(--green); color: #fff; }
  .btn .ic { font-size: 19px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="3"/><line x1="12" y1="3" x2="12" y2="7"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">추가 질문</span>
      <span class="rt"></span>
    </div>

    <div class="qprog">
      <div class="qpinfo">
        <span class="qplabel">정확한 진단을 위해</span>
        <span class="qpcount"><b id="curQ">2</b> / <span id="totalQ">5</span></span>
      </div>
      <div class="qpbar"><div class="qpfill" id="qpfill"></div></div>
    </div>

    <div class="scroll">
      <div class="ai-intro">
        <div class="av"><svg class="ic"><use href="#i-bot"/></svg></div>
        <div class="at">
          <b>AI가 추가로 확인 중이에요</b>
          <p>몇 가지만 더 알려주면 더 정확하게 진단해드릴 수 있어요</p>
        </div>
      </div>

      <h2 class="bigq">반점에 둥근<br>테두리(링)가 보이나요?</h2>
      <p class="bigsub">잎의 반점을 자세히 살펴보고 답해주세요</p>

      <div class="yesno" id="yesnoAns">
        <button class="ans on" data-v="예">
          예, 보여요
          <span class="arrow"><svg class="ic"><use href="#i-check"/></svg></span>
        </button>
        <button class="ans" data-v="아니오">
          아니요, 안 보여요
          <span class="arrow"><svg class="ic"><use href="#i-next"/></svg></span>
        </button>
      </div>
    </div>

    <div class="footer">
      <button class="btn btn-ghost" id="prevBtn">이전</button>
      <button class="btn btn-next" id="nextBtn">다음 <svg class="ic"><use href="#i-next"/></svg></button>
    </div>
  </div>

  <script>
    var cur = 2, total = 5;
    var curEl = document.getElementById('curQ');
    var totalEl = document.getElementById('totalQ');
    var fill = document.getElementById('qpfill');
    function renderProg(){
      curEl.textContent = cur;
      totalEl.textContent = total;
      fill.style.transform = 'scaleX(' + (cur/total) + ')';
    }
    renderProg();

    document.querySelectorAll('#yesnoAns .ans').forEach(function(a){
      a.addEventListener('click', function(){
        document.querySelectorAll('#yesnoAns .ans').forEach(function(x){
          x.classList.remove('on');
          var arrow = x.querySelector('.arrow use');
          if (arrow) arrow.setAttribute('href', '#i-next');
        });
        a.classList.add('on');
        var arrow = a.querySelector('.arrow use');
        if (arrow) arrow.setAttribute('href', '#i-check');
      });
    });
  </script>
</body>
</html>
