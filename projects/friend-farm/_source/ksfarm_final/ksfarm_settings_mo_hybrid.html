<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 환경설정</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --red: #B0612C;
    --r-lg: 18px; --r-md: 14px;
    --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,strong { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 800px;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { padding: 8px 20px 30px; }

  .sec-label { font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: var(--gray); padding: 18px 4px 8px; }

  .group { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 13px; padding: 15px 16px; width: 100%; text-align: left; }
  .item + .item { border-top: 1px solid var(--line); }
  .item:active { background: rgba(48,42,30,.03); }
  .item .li { width: 22px; height: 22px; color: var(--ink-2); font-size: 20px; display: grid; place-items: center; flex: 0 0 22px; }
  .item .lbl { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -0.016em; color: var(--ink); }
  .item .val { font-size: 13.5px; color: var(--gray); font-weight: 600; }
  .item .val.on { color: var(--green); font-weight: 700; }
  .item .cv { color: #9DA095; font-size: 15px; }

  /* toggle */
  .toggle { width: 46px; height: 28px; border-radius: 999px; background: #D6D5CB; position: relative; flex: 0 0 46px; transition: background .15s; }
  .toggle.on { background: var(--green); }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
  .toggle.on .knob { transform: translateX(18px); }

  .logout-wrap { margin-top: 28px; text-align: center; }
  .logout { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--gray); padding: 8px 12px; }
  .logout .ic { font-size: 15px; }
  .ver { margin-top: 10px; font-size: 11.5px; color: #A9AC9F; font-weight: 600; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V5z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-mega" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M17 5a8 8 0 0 1 0 14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">환경설정</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">

      <!-- 알림 -->
      <div class="sec-label">알림</div>
      <div class="group">
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-bell"/></svg></span><span class="lbl">알림 설정</span><svg class="ic cv"><use href="#i-cv"/></svg></a>
      </div>

      <!-- 약관 · 동의 -->
      <div class="sec-label">약관 · 동의</div>
      <div class="group">
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-doc"/></svg></span><span class="lbl">이용약관</span><svg class="ic cv"><use href="#i-cv"/></svg></a>
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-shield"/></svg></span><span class="lbl">개인정보 처리방침</span><svg class="ic cv"><use href="#i-cv"/></svg></a>
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-pin"/></svg></span><span class="lbl">위치기반 서비스 이용약관</span><svg class="ic cv"><use href="#i-cv"/></svg></a>
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-mega"/></svg></span><span class="lbl">마케팅 정보 수신</span><span class="val on">동의함</span><svg class="ic cv"><use href="#i-cv"/></svg></a>
      </div>

      <!-- 정보 -->
      <div class="sec-label">정보</div>
      <div class="group">
        <a class="item" href="#"><span class="li"><svg class="ic"><use href="#i-info"/></svg></span><span class="lbl">버전 정보</span><span class="val">1.0.0 · 최신</span></a>
      </div>

      <div class="logout-wrap">
        <button class="logout"><svg class="ic"><use href="#i-logout"/></svg> 로그아웃</button>
        <div class="ver">KS팜 · 농사친구 v1.0.0</div>
      </div>

    </div>
  </div>
</body>
</html>
