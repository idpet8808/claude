<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 마케팅 정보 수신 동의</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08);
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --r-lg: 18px; --r-md: 14px;
    --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,strong { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 800px;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { padding: 8px 20px 30px; }

  .intro { padding: 8px 4px 4px; }
  .intro .t { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; }
  .intro .d { font-size: 13px; color: var(--gray); margin-top: 9px; line-height: 1.6; }

  .sec-label { font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: var(--gray); padding: 22px 4px 8px; }

  /* master consent */
  .master { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .master .txt { flex: 1; }
  .master .t { font-size: 15.5px; font-weight: 800; letter-spacing: -0.016em; }
  .master .d { font-size: 12px; color: var(--gray); margin-top: 3px; }

  .group { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 13px; padding: 15px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .li { width: 22px; height: 22px; color: var(--ink-2); font-size: 20px; display: grid; place-items: center; flex: 0 0 22px; }
  .row .txt { flex: 1; }
  .row .t { font-size: 15px; font-weight: 600; letter-spacing: -0.016em; color: var(--ink); }
  .row .d { font-size: 12px; color: var(--gray); margin-top: 2px; }

  .toggle { width: 46px; height: 28px; border-radius: 999px; background: #D6D5CB; position: relative; flex: 0 0 46px; cursor: pointer; transition: background .15s; }
  .toggle.on { background: var(--green); }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
  .toggle.on .knob { transform: translateX(18px); }
  .toggle.disabled { opacity: .4; pointer-events: none; }

  .consent-note { font-size: 12px; color: var(--green); font-weight: 600; margin: 12px 4px 0; padding-left: 2px; display: flex; align-items: center; gap: 5px; }
  .consent-note .ic { font-size: 13px; }
  .consent-note.hide { display: none; }

  .terms-link { display: flex; align-items: center; padding: 15px 16px; width: 100%; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); margin-top: 16px; }
  .terms-link .li { width: 22px; height: 22px; color: var(--ink-2); font-size: 19px; display: grid; place-items: center; flex: 0 0 22px; margin-right: 13px; }
  .terms-link .lbl { flex: 1; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .terms-link .cv { color: #9DA095; font-size: 15px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-sms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.3 8.5 8.5 0 0 1-3.8-.9L3 20l1.1-4.2A8.38 8.38 0 0 1 3 11.5a8.5 8.5 0 0 1 9-8.3 8.38 8.38 0 0 1 9 8.3z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">마케팅 정보 수신 동의</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <div class="intro">
        <div class="t">이벤트·혜택 소식을<br>받아보시겠어요?</div>
        <div class="d">새 지원사업, 할인 이벤트, 유용한 영농 소식을 보내드려요. 동의는 선택이며 언제든 변경할 수 있어요.</div>
      </div>

      <!-- master -->
      <div class="master">
        <div class="txt"><div class="t">마케팅 정보 수신</div><div class="d">광고성 정보 수신 (선택)</div></div>
        <button class="toggle on" id="master"><span class="knob"></span></button>
      </div>

      <div class="consent-note" id="note"><svg class="ic"><use href="#i-check"/></svg> 2026.05.22 수신에 동의했어요</div>

      <!-- terms -->
      <a class="terms-link" href="#">
        <span class="li"><svg class="ic"><use href="#i-doc"/></svg></span>
        <span class="lbl">마케팅 정보 수신 동의 약관</span>
        <svg class="ic cv"><use href="#i-cv"/></svg>
      </a>
    </div>
  </div>

  <script>
    var master = document.getElementById('master');
    var note = document.getElementById('note');
    master.addEventListener('click', function(){
      master.classList.toggle('on');
      note.classList.toggle('hide', !master.classList.contains('on'));
    });
  </script>
</body>
</html>
