<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 영농일지 작성</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, textarea, select { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  /* 스텝 인디케이터 (2단계) */
  .steps { display: flex; align-items: flex-start; padding: 18px 30px 10px; flex-shrink: 0; }
  .stp { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 90px; }
  .stp .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--field-bg); color: var(--gray); }
  .stp .dot .ic { font-size: 15px; }
  .stp.on .dot { background: var(--green); color: #fff; }
  .stp.done .dot { background: var(--green-soft); color: var(--green); }
  .stp .nm { font-size: 12px; font-weight: 700; color: var(--gray); text-align: center; }
  .stp.on .nm { color: var(--ink); font-weight: 800; }
  .stp-line { flex: 1; height: 3px; background: var(--sage); margin: 13px 10px 0; border-radius: 3px; }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }

  .field { margin-bottom: 22px; }
  .field > label { display: flex; align-items: center; font-size: 13.5px; font-weight: 800; color: var(--ink); margin-bottom: 9px; letter-spacing: -0.01em; }
  .field > label .opt { margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--gray); }

  /* 생육 상태 칩 (3택) */
  .state-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
  .state { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 15px 8px; border-radius: var(--r-md); background: var(--field-bg); border: 1.5px solid transparent; transition: all .15s; }
  .state .sic { width: 24px; height: 24px; }
  .state .st { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .state.on { font-weight: 800; }
  .state.good.on { background: var(--green-soft); border-color: var(--green); }
  .state.good.on .sic, .state.good.on .st { color: var(--green); }
  .state.normal.on { background: #F3F0E6; border-color: var(--gold); }
  .state.normal.on .sic, .state.normal.on .st { color: var(--gold); }
  .state.warn.on { background: #FBF0E8; border-color: var(--clay); }
  .state.warn.on .sic, .state.warn.on .st { color: var(--clay); }

  /* 인풋·텍스트에어리어 */
  .input, .textarea { width: 100%; background: var(--field-bg); border: 1.5px solid transparent; border-radius: 12px; padding: 14px 15px; font-size: 14.5px; font-weight: 500; color: var(--ink); outline: none; transition: background .15s, border-color .15s, box-shadow .15s; }
  .input::placeholder, .textarea::placeholder { color: var(--gray); }
  .input:focus, .textarea:focus { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.1); }
  .textarea { min-height: 160px; resize: none; line-height: 1.55; }

  /* 단위 셀렉트 + 옵션 목록 */
  .selectbox { display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
  .selectbox .ic { color: var(--gray); font-size: 16px; }
  .opt-list { display: flex; flex-direction: column; }
  .opt-row { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 15px 4px; font-size: 15px; font-weight: 700; color: var(--ink-2); border-top: 1px solid var(--line); }
  .opt-row:first-child { border-top: 0; }
  .opt-row .urc { color: var(--green); opacity: 0; }
  .opt-row .urc .ic { font-size: 18px; }
  .opt-row.on { color: var(--green); font-weight: 800; }
  .opt-row.on .urc { opacity: 1; }
  .field .hint { font-size: 11.5px; color: var(--gray); font-weight: 500; margin-top: 7px; }

  /* 사용 자재 칩 + 등록 */
  .mat-chips { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .mat-chips:empty { margin-bottom: 0; }
  .mat-chip { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 12px; background: var(--green-soft); }
  .mat-chip .mt-name { flex: 1; font-size: 14px; font-weight: 800; color: var(--green); }
  .mat-chip .mt-amt { font-size: 13px; font-weight: 700; color: var(--sage); }
  .mat-chip .mt-x { width: 22px; height: 22px; border-radius: 50%; background: rgba(31,75,60,.16); color: var(--green); display: grid; place-items: center; flex-shrink: 0; }
  .mat-chip .mt-x .ic { font-size: 11px; }
  .mat-add { display: inline-flex; align-items: center; gap: 6px; padding: 12px 18px; border-radius: 12px; background: var(--field-bg); color: var(--green); font-size: 13.5px; font-weight: 800; width: 100%; justify-content: center; }
  .mat-add .ic { font-size: 16px; }
  .field .hint { font-size: 11.5px; color: var(--gray); font-weight: 500; margin-top: 9px; }

  /* 자재 등록 바텀시트 */
  .sheet-dim { position: absolute; inset: 0; background: transparent; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet-dim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 22px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); z-index: 11; max-height: 88%; overflow-y: auto; }
  .sheet.on { transform: translateY(0); }
  .sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 16px; }
  .sheet h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.35; }
  .sheet .sh-sub { font-size: 13px; color: var(--gray); font-weight: 600; margin: 0 0 20px; }
  .ms-field { margin-bottom: 6px; }
  .ms-field > label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
  .amt-row { display: flex; gap: 8px; }
  .amt-row .input { flex: 1; }
  .amt-unit { flex: 0 0 96px; }
  .ms-hint { font-size: 11.5px; color: var(--gray); font-weight: 500; margin: 7px 2px 18px; }
  .ms-reg { width: 100%; height: 50px; border-radius: 13px; background: var(--green-soft); color: var(--green); font-size: 14.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .ms-reg:disabled { background: var(--field-bg); color: #C3C4BA; }
  .ms-reg .ic { font-size: 16px; }
  .ms-box { min-height: 44px; padding: 4px 0; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .ms-box:empty::before { content: "등록한 자재가 여기에 표시돼요"; color: var(--gray); font-size: 12.5px; font-weight: 500; }
  .ms-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-radius: 999px; background: var(--green); color: #fff; font-size: 13px; font-weight: 700; height: fit-content; }
  .ms-tag .tx { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; }
  .ms-tag .tx .ic { font-size: 10px; }
  .ms-count { font-size: 11.5px; color: var(--gray); font-weight: 600; margin: 10px 2px 18px; }
  .ms-count b { color: var(--green); font-weight: 800; }
  .ms-actions { display: flex; gap: 10px; }
  .ms-btn { height: 52px; border-radius: 14px; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .ms-cancel { flex: 0 0 34%; background: var(--field-bg); color: var(--ink-2); }
  .ms-ok { flex: 1; background: var(--green); color: #fff; }

  /* 하단 버튼 */
  .footer { flex-shrink: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .btn { height: 52px; border-radius: 14px; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-ghost { flex: 0 0 34%; background: var(--field-bg); color: var(--ink-2); }
  .btn-primary { flex: 1; background: var(--green); color: #fff; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
    <!-- 생육 상태 -->
    <symbol id="s-good" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></symbol>
    <symbol id="s-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></symbol>
    <symbol id="s-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <a class="back" href="ksfarm_diary_write_mo_hybrid.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a>
      <span class="title">영농일지 작성</span>
      <span class="sp"></span>
    </div>

    <!-- 스텝 (2단계) -->
    <div class="steps">
      <div class="stp done"><span class="dot"><svg class="ic"><use href="#i-check"/></svg></span><span class="nm">기본정보 · 작업</span></div>
      <div class="stp-line"></div>
      <div class="stp on"><span class="dot">2</span><span class="nm">상세 기록</span></div>
    </div>

    <div class="scroll">
      <!-- 생육 상태 -->
      <div class="field">
        <label>생육 상태 <span class="opt">선택</span></label>
        <div class="state-grid" id="stateGrid">
          <button class="state good on"><svg class="ic sic"><use href="#s-good"/></svg><span class="st">좋음</span></button>
          <button class="state normal"><svg class="ic sic"><use href="#s-normal"/></svg><span class="st">보통</span></button>
          <button class="state warn"><svg class="ic sic"><use href="#s-warn"/></svg><span class="st">주의</span></button>
        </div>
      </div>

      <!-- 사용 자재 -->
      <div class="field">
        <label>사용 자재 <span class="opt">선택</span></label>
        <div class="mat-chips" id="matChips"></div>
        <button class="mat-add" id="matAdd"><svg class="ic"><use href="#i-plus"/></svg> 자재 등록</button>
        <p class="hint">방제·시비 등에 사용한 약제·비료를 등록하세요</p>
      </div>

      <!-- 상세 입력 -->
      <div class="field">
        <label>상세 입력 <span class="opt">선택</span></label>
        <textarea class="textarea" placeholder="오늘 작업 내용이나 작물 상태를 자유롭게 적어보세요"></textarea>
      </div>
    </div>

    <div class="footer">
      <a class="btn btn-ghost" href="ksfarm_diary_write_mo_hybrid.html">이전</a>
      <a class="btn btn-primary" href="ksfarm_diary_list_mo_hybrid.html">등록 완료</a>
    </div>

    <!-- 자재 등록 바텀시트 -->
    <div class="sheet-dim" id="msDim"></div>
    <div class="sheet" id="msSheet">
      <div class="sheet-grip"></div>
      <h3>사용한 자재가 있나요?<br>제품명과 사용량을 입력하세요</h3>
      <p class="sh-sub">방제·시비에 쓴 약제·비료를 기록해요</p>

      <div class="ms-field">
        <label>제품명</label>
        <input class="input" id="msName" type="text" placeholder="예: 아미스타 탑"/>
        <p class="ms-hint">2자 이상 입력해주세요</p>
      </div>

      <div class="ms-field">
        <label>사용량</label>
        <div class="amt-row">
          <input class="input" id="msAmt" type="number" inputmode="numeric" placeholder="사용량 입력"/>
          <div class="input selectbox amt-unit" id="msUnitTrigger"><span id="msUnitVal">mL</span><svg class="ic"><use href="#i-down"/></svg></div>
        </div>
        <p class="ms-hint">제품에 표시된 단위로 입력하세요</p>
      </div>

      <button class="ms-reg" id="msReg"><svg class="ic"><use href="#i-plus"/></svg> 자재 등록</button>

      <div class="ms-box" id="msBox"></div>
      <p class="ms-count">최대 7개까지 등록 가능 (<b id="msCount">0</b>/7)</p>

      <div class="ms-actions">
        <button class="ms-btn ms-cancel" id="msCancel">취소</button>
        <button class="ms-btn ms-ok" id="msOk">확인</button>
      </div>
    </div>

    <!-- 단위 선택 미니 시트 -->
    <div class="sheet-dim" id="unitDim"></div>
    <div class="sheet" id="unitSheet">
      <div class="sheet-grip"></div>
      <h3>단위 선택</h3>
      <div class="opt-list" id="unitList" style="margin-top:8px">
        <button class="opt-row on" data-u="mL">mL<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
        <button class="opt-row" data-u="L">L<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
        <button class="opt-row" data-u="g">g<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
        <button class="opt-row" data-u="kg">kg<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
        <button class="opt-row" data-u="배">배 (희석)<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
        <button class="opt-row" data-u="포">포<span class="urc"><svg class="ic"><use href="#i-check"/></svg></span></button>
      </div>
    </div>
  </div>

  <script>
    // 생육 상태 단일 선택
    document.querySelectorAll('#stateGrid .state').forEach(function(s){
      s.addEventListener('click', function(){
        document.querySelectorAll('#stateGrid .state').forEach(function(x){ x.classList.remove('on'); });
        s.classList.add('on');
      });
    });

    function showSheet(s, d){ s.classList.add('on'); d.classList.add('on'); }
    function hideSheet(s, d){ s.classList.remove('on'); d.classList.remove('on'); }

    // 자재 등록 시트
    var msSheet = document.getElementById('msSheet');
    var msDim = document.getElementById('msDim');
    var msName = document.getElementById('msName');
    var msAmt = document.getElementById('msAmt');
    var msUnitVal = document.getElementById('msUnitVal');
    var msBox = document.getElementById('msBox');
    var msCount = document.getElementById('msCount');
    var msReg = document.getElementById('msReg');
    var matChips = document.getElementById('matChips');

    var materials = [{ name: '아미스타 탑', amt: '1000', unit: '배' }]; // 임시 등록 데이터
    var draft = [];

    function renderMainChips(){
      matChips.innerHTML = materials.map(function(m, i){
        return '<div class="mat-chip"><span class="mt-name">'+m.name+'</span><span class="mt-amt">'+m.amt+m.unit+'</span><button class="mt-x" data-i="'+i+'" aria-label="삭제"><svg class="ic"><use href="#i-x"/></svg></button></div>';
      }).join('');
      matChips.querySelectorAll('.mt-x').forEach(function(b){
        b.addEventListener('click', function(){ materials.splice(parseInt(b.dataset.i),1); renderMainChips(); });
      });
    }

    function renderDraftBox(){
      msBox.innerHTML = draft.map(function(m, i){
        return '<span class="ms-tag">'+m.name+' / '+m.amt+m.unit+'<button class="tx" data-i="'+i+'" aria-label="삭제"><svg class="ic"><use href="#i-x"/></svg></button></span>';
      }).join('');
      msBox.querySelectorAll('.tx').forEach(function(b){
        b.addEventListener('click', function(){ draft.splice(parseInt(b.dataset.i),1); renderDraftBox(); updateCount(); });
      });
    }
    function updateCount(){
      msCount.textContent = draft.length;
      msReg.disabled = draft.length >= 7;
    }

    document.getElementById('matAdd').addEventListener('click', function(){
      draft = materials.slice();
      renderDraftBox(); updateCount();
      msName.value = ''; msAmt.value = ''; msUnitVal.textContent = 'mL';
      showSheet(msSheet, msDim);
    });
    msReg.addEventListener('click', function(){
      var n = msName.value.trim();
      if (n.length < 2 || !msAmt.value || draft.length >= 7) return;
      draft.push({ name: n, amt: msAmt.value, unit: msUnitVal.textContent });
      msName.value = ''; msAmt.value = '';
      renderDraftBox(); updateCount();
    });
    document.getElementById('msCancel').addEventListener('click', function(){ hideSheet(msSheet, msDim); });
    document.getElementById('msOk').addEventListener('click', function(){
      materials = draft.slice();
      renderMainChips();
      hideSheet(msSheet, msDim);
    });
    msDim.addEventListener('click', function(){ hideSheet(msSheet, msDim); });

    // 단위 선택 미니 시트
    var unitSheet = document.getElementById('unitSheet');
    var unitDim = document.getElementById('unitDim');
    document.getElementById('msUnitTrigger').addEventListener('click', function(){ showSheet(unitSheet, unitDim); });
    document.querySelectorAll('#unitList .opt-row').forEach(function(o){
      o.addEventListener('click', function(){
        document.querySelectorAll('#unitList .opt-row').forEach(function(x){ x.classList.remove('on'); });
        o.classList.add('on');
        msUnitVal.textContent = o.dataset.u;
        hideSheet(unitSheet, unitDim);
      });
    });
    unitDim.addEventListener('click', function(){ hideSheet(unitSheet, unitDim); });

    renderMainChips();
  </script>
</body>
</html>
