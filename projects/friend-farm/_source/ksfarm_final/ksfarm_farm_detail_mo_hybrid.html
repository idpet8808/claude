<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 농장 정보 조회</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,strong { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 840px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .more { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-2); position: relative; }
  .appbar .more .ic { font-size: 20px; }

  /* 액션 시트 */
  .sheet-scrim { position: absolute; inset: 0; background: rgba(24,20,12,.45); z-index: 20; border-radius: 30px; overflow: hidden; display: flex; align-items: flex-end;
    opacity: 0; visibility: hidden; transition: opacity .26s ease, visibility .26s ease; }
  .sheet-scrim.show { opacity: 1; visibility: visible; }
  .action-sheet { width: 100%; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .4s cubic-bezier(.22,1,.36,1); }
  .sheet-scrim.show .action-sheet { transform: translateY(0); }
  .as-group { background: rgba(248,247,243,.92); backdrop-filter: blur(14px); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
  .as-item { width: 100%; height: 56px; font-size: 16px; font-weight: 700; color: var(--green); display: flex; align-items: center; justify-content: center; }
  .as-item + .as-item { border-top: 1px solid var(--line); }
  .as-item.del { color: var(--clay); }
  .as-item:active { background: rgba(0,0,0,.04); }
  .as-cancel { width: 100%; height: 56px; background: var(--card); border-radius: 16px; font-size: 16px; font-weight: 800; color: var(--ink); }
  .as-cancel:active { background: var(--field-bg); }

  /* 모달 공통 */
  .modal-scrim { position: absolute; inset: 0; background: rgba(24,20,12,.5); z-index: 30; border-radius: 30px; overflow: hidden; display: grid; place-items: center; padding: 0 32px;
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
  .modal-scrim.show { opacity: 1; visibility: visible; }
  .modal { width: 100%; max-width: 320px; background: var(--card); border-radius: 22px; padding: 28px 24px 20px; text-align: center;
    transform: scale(.92); transition: transform .28s cubic-bezier(.22,1,.36,1); }
  .modal-scrim.show .modal { transform: scale(1); }
  .modal-ic { width: 58px; height: 58px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; margin: 0 auto 16px; }
  .modal-ic .ic { font-size: 32px; }
  .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .modal-desc { font-size: 13.5px; color: var(--gray); line-height: 1.6; margin-top: 10px; font-weight: 500; }
  .modal-btn { width: 100%; height: 52px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; margin-top: 22px;
    background: linear-gradient(180deg, #2C6150, var(--green) 52%, var(--green-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }
  .modal-actions { display: flex; gap: 9px; margin-top: 22px; }
  .mbtn-ghost { flex: 1; height: 52px; border-radius: var(--r-md); font-size: 15px; font-weight: 800; color: var(--ink-2); background: var(--field-bg); }
  .mbtn-danger { flex: 1; height: 52px; border-radius: var(--r-md); font-size: 15px; font-weight: 800; color: #fff; background: var(--clay); }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px calc(32px + env(safe-area-inset-bottom)); }

  /* 농장 제목 */
  .farm-head { padding: 10px 2px 0; }
  .fh-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green); margin-bottom: 2px; }
  .fh-name { font-size: 23px; font-weight: 800; letter-spacing: -0.026em; line-height: 1.25; }

  /* 사진 스와이프 갤러리 */
  .gallery { margin-top: 14px; position: relative; }
  .gallery .track { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 16px; -ms-overflow-style: none; scrollbar-width: none; }
  .gallery .track::-webkit-scrollbar { display: none; }
  .gallery .slide { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 16/9; background: var(--green-soft); }
  .gallery .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery .slide.empty { background: linear-gradient(155deg, #3A6B57, var(--green) 65%, var(--green-2)); display: grid; place-items: center; color: rgba(255,255,255,.45); }
  .gallery .slide.empty .ic { font-size: 44px; }
  .gallery .dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; }
  .gallery .dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); transition: all .2s; }
  .gallery .dots .dot.on { width: 18px; border-radius: 999px; background: #fff; }
  .gallery .counter { position: absolute; top: 12px; right: 12px; font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.42); padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(4px); }

  /* 정보 카드 (묶음) */
  .sec { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 4px 16px; margin-top: 16px; }
  .info-row { display: flex; flex-direction: column; gap: 5px; padding: 14px 0; }
  .info-row + .info-row { border-top: 1px solid var(--line); }
  .info-row .k { font-size: 12.5px; color: var(--gray); font-weight: 600; }
  .info-row .v { font-size: 15.5px; color: var(--ink); font-weight: 700; letter-spacing: -0.014em; }
  .info-row .v.loc { display: flex; align-items: center; gap: 5px; }
  .info-row .v.loc .ic { font-size: 16px; color: var(--green); }
  .info-row .v .sub { font-size: 13px; color: var(--gray); font-weight: 600; margin-left: 4px; }

  /* 재배작물 */
  .sec-title-out { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: -0.016em; padding: 24px 2px 4px; }
  .crop-list { display: flex; flex-direction: column; gap: 8px; }
  .crop-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 14px 16px; }
  .crop-item .ci-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .crop-item .ci-name { flex: 1; font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .crop-item .ci-meta { font-size: 12.5px; font-weight: 600; color: var(--gray); }
  .crop-item .rep-mini { font-size: 10px; font-weight: 800; color: var(--green); background: var(--green-soft); padding: 2px 7px; border-radius: 999px; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-edit { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }
  .btn-edit .ic { font-size: 18px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-check-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-13.71 2"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">농장 정보 조회</span>
      <button class="more" id="moreBtn" aria-label="더보기"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>

    <div class="scroll">
      <!-- 농장 제목 -->
      <div class="farm-head">
        <span class="fh-badge">대표농장</span>
        <h1 class="fh-name">강남 역삼 농원</h1>
      </div>

      <!-- 사진 스와이프 -->
      <div class="gallery">
        <div class="track" id="track">
          <div class="slide"><img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
          <div class="slide"><img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
          <div class="slide"><img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800&q=80" onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='<svg class=&quot;ic&quot;><use href=&quot;#i-leaf&quot;/></svg>';"/></div>
        </div>
        <span class="counter" id="counter">1 / 3</span>
        <div class="dots" id="dots">
          <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <!-- 농장 정보 (묶음 카드) -->
      <div class="sec">
        <div class="info-row">
          <span class="k">농장위치</span>
          <span class="v loc"><svg class="ic"><use href="#i-pin"/></svg> 서울특별시 종로구</span>
        </div>
        <div class="info-row">
          <span class="k">재배방법</span>
          <span class="v">토경재배</span>
        </div>
        <div class="info-row">
          <span class="k">재배면적</span>
          <span class="v">1,200 ㎡ <span class="sub">· 363 평</span></span>
        </div>
      </div>

      <!-- 재배작물 -->
      <div class="sec-title-out">재배작물 2종</div>
      <div class="crop-list">
        <div class="crop-item">
          <span class="ci-dot"></span>
          <span class="ci-name">오이 (백다다기)</span>
          <span class="rep-mini">대표</span>
          <span class="ci-meta">500주</span>
        </div>
        <div class="crop-item">
          <span class="ci-dot"></span>
          <span class="ci-name">딸기</span>
        </div>
      </div>
    </div>

    <!-- 더보기 액션 시트 -->
    <div class="sheet-scrim" id="actionSheet">
      <div class="action-sheet">
        <div class="as-group">
          <button class="as-item" id="asEdit">농장 수정</button>
          <button class="as-item del" id="asDelete">농장 삭제</button>
        </div>
        <button class="as-cancel" id="asCancel">취소</button>
      </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal-scrim" id="confirmModal">
      <div class="modal">
        <div class="modal-title">농장을 삭제할까요?</div>
        <div class="modal-desc">삭제하면 농장 정보와 작성한<br>일지를 되돌릴 수 없어요.</div>
        <div class="modal-actions">
          <button class="mbtn-ghost" id="confirmCancel">취소</button>
          <button class="mbtn-danger" id="confirmDelete">삭제</button>
        </div>
      </div>
    </div>

    <!-- 삭제 완료 모달 -->
    <div class="modal-scrim" id="deletedModal">
      <div class="modal">
        <div class="modal-ic"><svg class="ic"><use href="#i-check-c"/></svg></div>
        <div class="modal-title">농장 정보 삭제 완료</div>
        <div class="modal-desc">농장 정보를 삭제했어요.</div>
        <button class="modal-btn" id="deletedOk">확인</button>
      </div>
    </div>
  </div>

  <script>
    function show(id){ document.getElementById(id).classList.add('show'); }
    function hide(id){ document.getElementById(id).classList.remove('show'); }

    // 더보기 → 액션 시트
    document.getElementById('moreBtn').addEventListener('click', function(){ show('actionSheet'); });
    document.getElementById('asCancel').addEventListener('click', function(){ hide('actionSheet'); });
    document.getElementById('actionSheet').addEventListener('click', function(e){
      if (!e.target.closest('.action-sheet')) hide('actionSheet');
    });

    // 수정 → 농장 수정 페이지로 이동
    document.getElementById('asEdit').addEventListener('click', function(){
      hide('actionSheet');
      window.location.href = 'ksfarm_farm_edit_mo_hybrid.html';
    });

    // 삭제 → 확인 모달 → 완료 모달
    document.getElementById('asDelete').addEventListener('click', function(){
      hide('actionSheet');
      setTimeout(function(){ show('confirmModal'); }, 180);
    });
    document.getElementById('confirmCancel').addEventListener('click', function(){ hide('confirmModal'); });
    document.getElementById('confirmDelete').addEventListener('click', function(){
      hide('confirmModal');
      setTimeout(function(){ show('deletedModal'); }, 180);
    });
    document.getElementById('deletedOk').addEventListener('click', function(){ hide('deletedModal'); });

    // 사진 스와이프 인디케이터
    var track = document.getElementById('track');
    if (track) {
      var dots = document.querySelectorAll('#dots .dot');
      var counter = document.getElementById('counter');
      var total = track.querySelectorAll('.slide').length;
      track.addEventListener('scroll', function(){
        var i = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach(function(d, idx){ d.classList.toggle('on', idx === i); });
        counter.textContent = (i + 1) + ' / ' + total;
      });
    }
  </script>
</body>
</html>
