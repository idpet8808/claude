<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 작물별 재배 가이드</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.08); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --sage: #2F6150; --gold: #B08A3E; --clay: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42); min-height: 860px;
    display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .act { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-2); }
  .appbar .act .ic { font-size: 19px; }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }

  /* 이번 달 추천 피처 */
  .feature { border-radius: var(--r-lg); overflow: hidden; position: relative; aspect-ratio: 16/9; margin: 6px 0 22px;
    background: linear-gradient(150deg, #3A6B57, var(--green) 68%, var(--green-2)); display: flex; align-items: flex-end; }
  .feature .fbadge { position: absolute; top: 14px; left: 14px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: var(--green); background: rgba(255,255,255,.94); padding: 5px 11px; border-radius: 999px; }
  .feature .fbadge .ic { font-size: 12px; color: var(--gold); }
  .feature .fcrop { position: absolute; top: 50%; right: 8%; transform: translateY(-58%); width: 110px; height: 110px; opacity: .92; filter: drop-shadow(0 4px 10px rgba(0,0,0,.2)); }
  .feature .fcrop svg { width: 100%; height: 100%; }
  .feature .fcap { position: relative; padding: 16px 18px 18px; color: #fff; z-index: 1; }
  .feature .fcap .ft { font-size: 22px; font-weight: 800; letter-spacing: -0.022em; }
  .feature .fcap .fd { font-size: 12.5px; opacity: .92; margin-top: 5px; font-weight: 500; }

  .sec-h { font-size: 14px; font-weight: 800; letter-spacing: -0.016em; margin: 0 2px 12px; }

  /* 카테고리 칩 */
  .cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -ms-overflow-style: none; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex-shrink: 0; padding: 8px 15px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .cat.on { background: var(--green); color: #fff; box-shadow: none; }

  /* 큰 가로 리스트 */
  .list { display: flex; flex-direction: column; gap: 11px; }
  .lc { display: flex; gap: 13px; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 13px; align-items: center; }
  .lc .lth { width: 76px; height: 76px; border-radius: 13px; background: linear-gradient(150deg, #EAE8DC, #E0DECF); display: grid; place-items: center; flex-shrink: 0; overflow: hidden; }
  .lc .lth .cropimg { width: 64px; height: 64px; }
  .lc .lin { flex: 1; min-width: 0; }
  .lc .lnm { font-size: 16px; font-weight: 800; letter-spacing: -0.018em; }
  .lc .ltype { font-size: 11.5px; color: var(--gray); font-weight: 600; margin-top: 4px; }
  .lc .lmeta { font-size: 11.5px; color: var(--sage); font-weight: 700; margin-top: 7px; }
  .lc .lcv { color: #C7C8BE; font-size: 20px; flex-shrink: 0; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
    <!-- 작물 일러스트 -->
    <symbol id="c-tomato" viewBox="0 0 64 64"><circle cx="32" cy="38" r="20" fill="#C2502E"/><circle cx="32" cy="38" r="20" fill="none" stroke="#A23F22" stroke-width="1.5"/><path d="M32 20c-2-6-7-8-7-8s1 6 5 8c-3-1-7 0-7 0s3 4 9 3c-4 1-6 5-6 5s5 1 8-3c0 4 5 6 5 6s1-5-2-8c4 2 9 1 9 1s-3-5-9-5c5-2 6-7 6-7s-6 0-8 4c0-4-6-7-6-7s2 5 0 11z" fill="#3E7A3A"/><circle cx="25" cy="35" r="4" fill="#D8714F" opacity=".6"/></symbol>
    <symbol id="c-pepper" viewBox="0 0 64 64"><path d="M38 18c2-4 8-5 8-5s0 6-5 8c2 1 3 4 3 8 0 11-7 20-14 20S18 41 18 32c0-7 6-12 13-12 3 0 5 1 7 2z" fill="#B0612C"/><path d="M38 18c2-4 8-5 8-5s0 6-5 8" fill="none" stroke="#2F6150" stroke-width="3" stroke-linecap="round"/><path d="M31 20c-7 0-13 5-13 12 0 9 5 17 12 19" fill="none" stroke="#974E1F" stroke-width="1.5" opacity=".5"/></symbol>
    <symbol id="c-cucumber" viewBox="0 0 64 64"><rect x="24" y="10" width="16" height="44" rx="8" fill="#3E7A3A" transform="rotate(18 32 32)"/><rect x="24" y="10" width="16" height="44" rx="8" fill="none" stroke="#2F6150" stroke-width="1.5" transform="rotate(18 32 32)"/><g fill="#2F6150"><circle cx="28" cy="20" r="1.4"/><circle cx="32" cy="30" r="1.4"/><circle cx="36" cy="40" r="1.4"/><circle cx="34" cy="24" r="1.4"/><circle cx="30" cy="36" r="1.4"/></g></symbol>
    <symbol id="c-eggplant" viewBox="0 0 64 64"><path d="M40 22c6 4 9 11 6 19-3 9-13 15-21 12-7-3-9-12-4-19 3-5 9-8 13-9-1-3 0-7 0-7s4 2 6 4z" fill="#5E3A6E"/><path d="M40 22c-2-2-6-4-6-4s-1 4 0 7" fill="none" stroke="#2F6150" stroke-width="3" stroke-linecap="round"/><path d="M44 28c2 8-2 16-9 19" fill="none" stroke="#4A2D58" stroke-width="1.5" opacity=".5"/></symbol>
    <symbol id="c-cabbage" viewBox="0 0 64 64"><circle cx="32" cy="34" r="21" fill="#7FA86A"/><path d="M32 13c-8 2-15 9-16 18M51 30c-3-8-10-15-19-17M14 36c2 9 9 16 18 17M50 38c-3 8-10 13-18 13" fill="none" stroke="#5C8049" stroke-width="2.2" stroke-linecap="round"/><circle cx="32" cy="34" r="9" fill="#9CC084"/><circle cx="32" cy="34" r="9" fill="none" stroke="#5C8049" stroke-width="1.5"/></symbol>
    <symbol id="c-greenonion" viewBox="0 0 64 64"><g stroke="#3E7A3A" stroke-width="5" stroke-linecap="round" fill="none"><path d="M26 54V22c0-6 1-10 1-10"/><path d="M32 54V18c0-4 0-8 0-8"/><path d="M38 54V22c0-6-1-10-1-10"/></g><path d="M22 54h20l-2 4H24z" fill="#E8E4D4"/><rect x="22" y="48" width="20" height="7" rx="2" fill="#F2EFE3"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">작물별 재배 가이드</span>
      <button class="act" aria-label="검색"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>

    <div class="scroll">
      <!-- 이번 달 추천 -->
      <a class="feature">
        <span class="fbadge"><svg class="ic"><use href="#i-sun"/></svg> 5월 이번 달 추천</span>
        <span class="fcrop"><svg viewBox="0 0 64 64"><use href="#c-tomato"/></svg></span>
        <div class="fcap">
          <div class="ft">토마토</div>
          <div class="fd">지금이 정식하기 딱 좋은 시기예요</div>
        </div>
      </a>

      <!-- 카테고리 -->
      <div class="cats">
        <button class="cat on">전체</button>
        <button class="cat">과채류</button>
        <button class="cat">엽채류</button>
        <button class="cat">근채류</button>
        <button class="cat">곡류</button>
        <button class="cat">특용작물</button>
      </div>

      <!-- 작물 리스트 -->
      <div class="list">
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-tomato"/></svg></span>
          <div class="lin"><div class="lnm">토마토</div><div class="ltype">시설/노지 재배</div><div class="lmeta">적정 20~28℃ · 정식 후 90~120일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-pepper"/></svg></span>
          <div class="lin"><div class="lnm">고추</div><div class="ltype">시설/노지 재배</div><div class="lmeta">적정 25~28℃ · 정식 후 약 100일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-cucumber"/></svg></span>
          <div class="lin"><div class="lnm">오이</div><div class="ltype">시설/노지 재배</div><div class="lmeta">적정 22~28℃ · 정식 후 50~60일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-eggplant"/></svg></span>
          <div class="lin"><div class="lnm">가지</div><div class="ltype">시설 재배</div><div class="lmeta">적정 22~30℃ · 정식 후 70~90일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-cabbage"/></svg></span>
          <div class="lin"><div class="lnm">배추</div><div class="ltype">노지 재배</div><div class="lmeta">적정 18~20℃ · 정식 후 70~90일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
        <a class="lc">
          <span class="lth"><svg class="cropimg" viewBox="0 0 64 64"><use href="#c-greenonion"/></svg></span>
          <div class="lin"><div class="lnm">대파</div><div class="ltype">노지 재배</div><div class="lmeta">적정 15~25℃ · 정식 후 90~120일</div></div>
          <svg class="ic lcv"><use href="#i-cv"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.cat').forEach(function(c){
      c.addEventListener('click', function(){
        document.querySelectorAll('.cat').forEach(function(x){ x.classList.remove('on'); });
        c.classList.add('on');
      });
    });
  </script>
</body>
</html>
