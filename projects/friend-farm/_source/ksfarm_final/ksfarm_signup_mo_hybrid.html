<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 회원가입</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.10); --field-bg: #F4F4EF;
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --red: #B0612C;
    --r-lg: 18px; --r-md: 14px; --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    width: min(390px, 100%); background: var(--bg);
    border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 880px; display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .progress { padding: 6px 20px 0; flex-shrink: 0; }
  .progress .bar { height: 4px; border-radius: 999px; background: rgba(48,42,30,.1); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 100%; background: var(--green); border-radius: 999px; }
  .progress .step { font-size: 11.5px; color: var(--gray); font-weight: 700; margin-top: 7px; }

  .scroll { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  .lead { font-size: 22px; font-weight: 800; letter-spacing: -0.024em; line-height: 1.34; margin: 4px 2px 6px; }
  .lead-sub { font-size: 13px; color: var(--gray); margin: 0 2px 22px; font-weight: 500; }
  .lead-sub .req { color: var(--red); font-weight: 700; }

  .field { margin-bottom: 16px; }
  .field .lab { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; padding-left: 2px; letter-spacing: -0.01em; }
  .field .lab .req { color: var(--red); }
  .field .box { display: flex; align-items: center; gap: 8px; background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md); padding: 0 14px; height: 52px; transition: border-color .12s, background .12s, box-shadow .12s; }
  .field .inp { flex: 1; width: 100%; border: 0; background: transparent; padding: 0; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none; }
  .field .inp::placeholder { color: #ADAFa4; font-weight: 500; }
  .field .box:focus-within { background: var(--card); border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,75,60,.10); }
  .eye { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--gray); flex: 0 0 26px; }
  .eye .ic { font-size: 18px; }
  /* inline check button (아이디 중복확인 등) */
  .field .row2 { display: flex; gap: 8px; }
  .field .row2 .box { flex: 1; }
  .field .row2 .mini { flex: 0 0 auto; padding: 0 16px; height: 52px; border-radius: var(--r-md); background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; }

  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn-submit { width: 100%; height: 54px; border-radius: var(--r-md); color: #fff; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.1A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3 3.7M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7a9.5 9.5 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><line x1="3" y1="3" x2="21" y2="21"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">회원가입</span>
      <span class="sp"></span>
    </div>

    <div class="progress">
      <div class="bar"><i></i></div>
      <div class="step">2 / 2 단계 · 정보 입력</div>
    </div>

    <div class="scroll">
      <h2 class="lead">가입 정보를<br>입력해 주세요</h2>
      <p class="lead-sub"><span class="req">*</span> 표시는 필수 입력 항목이에요.</p>

      <div class="field">
        <label class="lab" for="s-id">아이디 <span class="req">*</span></label>
        <div class="row2">
          <div class="box"><input class="inp" id="s-id" type="text" placeholder="영문, 숫자 4~20자" /></div>
          <button class="mini">중복확인</button>
        </div>
      </div>

      <div class="field">
        <label class="lab" for="s-pw">비밀번호 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-pw" type="password" placeholder="영문·숫자·특수문자 8~20자" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <div class="field">
        <label class="lab" for="s-pw2">비밀번호 확인 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-pw2" type="password" placeholder="비밀번호 재입력" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <div class="field">
        <label class="lab" for="s-name">이름 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-name" type="text" placeholder="이름" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-nick">닉네임 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-nick" type="text" placeholder="닉네임" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-email">이메일 <span class="req">*</span></label>
        <div class="box"><input class="inp" id="s-email" type="email" placeholder="example@email.com" /></div>
      </div>

      <div class="field">
        <label class="lab" for="s-phone">휴대폰 번호</label>
        <div class="box"><input class="inp" id="s-phone" type="tel" placeholder="010-0000-0000" /></div>
      </div>
    </div>

    <div class="foot">
      <button class="btn-submit">회원가입</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.eye').forEach(function(btn){
      btn.addEventListener('click', function(){
        var inp = btn.parentElement.querySelector('.inp');
        var use = btn.querySelector('use');
        if (inp.type === 'password') { inp.type = 'text'; use.setAttribute('href', '#i-eye-off'); }
        else { inp.type = 'password'; use.setAttribute('href', '#i-eye'); }
      });
    });
  </script>
</body>
</html>
