<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 회원정보 수정</title>
<style>
  :root {
    --bg: #ECEAE0; --card: #FFFFFF; --ink: #20251D; --ink-2: #45493E; --gray: #76796C;
    --line: rgba(48,42,30,.10);
    --field-bg: #F4F4EF;            /* 토스식 옅은 면 인풋 */
    --green: #1F4B3C; --green-2: #163729; --green-soft: #E7EEE6;
    --red: #B0612C;
    --r-lg: 18px; --r-md: 14px;
    --shadow: 0 1px 2px rgba(36,30,18,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font-family: inherit; }
  a, button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; }
  h1,h2,h3,p,span,a,label { word-break: keep-all; }
  body {
    background: #D8D5C9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 24px 0 40px;
  }
  .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex-shrink: 0; }

  .phone {
    position: relative; width: min(390px, 100%);
    background: var(--bg); border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 44px -12px rgba(40,34,22,.42);
    min-height: 820px; display: flex; flex-direction: column;
  }

  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .status-bar .group { display: inline-flex; gap: 6px; align-items: center; }

  .appbar { display: flex; align-items: center; padding: 4px 12px 0; flex-shrink: 0; }
  .appbar .back { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }
  .appbar .back .ic { font-size: 22px; }
  .appbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .appbar .sp { width: 38px; }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }

  .lead { font-size: 21px; font-weight: 800; letter-spacing: -0.024em; line-height: 1.34; margin: 10px 2px 22px; }

  /* field */
  .field { margin-bottom: 16px; }
  .field .lab { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; padding-left: 2px; letter-spacing: -0.01em; }
  .field .box {
    display: flex; align-items: center; gap: 8px;
    background: var(--field-bg); border: 1.5px solid transparent; border-radius: var(--r-md);
    padding: 0 14px; height: 52px; transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .field .inp {
    flex: 1; width: 100%; border: 0; background: transparent; padding: 0;
    font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.014em; outline: none;
  }
  .field .inp::placeholder { color: #ADAFa4; font-weight: 500; }
  /* focus (토스식: 딥틸 테두리 + 흰 배경 + 글로우) */
  .field .box:focus-within {
    background: var(--card); border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(31,75,60,.10);
  }
  .field .box:focus-within .clear { display: inline-flex; }
  /* clear button */
  .clear { display: none; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #C9C9BE; color: #fff; flex: 0 0 20px; padding: 0; line-height: 0; }
  .clear .ic { width: 11px; height: 11px; font-size: 11px; vertical-align: middle; display: block; }
  .clear:active { background: #B7B7AC; }

  /* readonly (아이디) */
  .field.readonly .box { background: #EFEFEA; }
  .field.readonly .val { flex: 1; font-size: 16px; font-weight: 600; color: var(--gray); }
  .field.readonly .lock { color: #A9AC9F; font-size: 16px; }

  /* password link row */
  .field.linkrow .box { cursor: pointer; }
  .field.linkrow .pw { flex: 1; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: 2px; }
  .field.linkrow .go { font-size: 13px; font-weight: 700; color: var(--green); display: inline-flex; align-items: center; gap: 1px; letter-spacing: normal; }
  .field.linkrow .go .ic { font-size: 15px; }

  .help { font-size: 11.5px; color: var(--gray); margin: 4px 4px 0; line-height: 1.5; }

  /* footer */
  .foot { flex-shrink: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; background: var(--bg); border-top: 1px solid var(--line); }
  .btn { height: 52px; border-radius: var(--r-md); font-size: 15px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; }
  .btn-quit { flex: 0 0 36%; background: #EFEEE8; color: var(--gray); }
  .btn-save { flex: 1; color: #fff; background: linear-gradient(180deg, #2C6150 0%, var(--green) 52%, var(--green-2) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -8px rgba(22,55,41,.5); }

  /* success toast */
  .toast-wrap { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center; z-index: 20; padding: 0 20px; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
  .toast-wrap.show { opacity: 1; transform: translateY(0); }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--green-2); color: #fff; padding: 14px 18px; border-radius: 14px; box-shadow: 0 10px 26px -8px rgba(22,55,41,.55); width: 100%; max-width: 330px; }
  .toast .tic { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .toast .tic .ic { font-size: 14px; }
  .toast .tt { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }

  /* withdraw dialog */
  .scrim { position: absolute; inset: 0; background: rgba(24,20,12,.5); z-index: 30; display: none; place-items: center; padding: 0 28px; }
  .scrim.show { display: grid; }
  .dialog { width: 100%; max-width: 300px; background: var(--card); border-radius: 20px; padding: 24px 22px 18px; text-align: center; box-shadow: 0 18px 40px -10px rgba(36,30,18,.4); }
  .dlg-title { font-size: 17.5px; font-weight: 800; letter-spacing: -0.02em; }
  .dlg-desc { font-size: 13px; color: var(--gray); line-height: 1.55; margin-top: 9px; }
  .dlg-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 9px; }
  .dlg-btn { height: 48px; border-radius: var(--r-md); font-size: 14.5px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; }
  .dlg-cancel { background: linear-gradient(180deg,#2C6150,var(--green) 52%,var(--green-2)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -8px rgba(22,55,41,.5); }
  .dlg-danger { background: var(--card); color: var(--red); border: 1.5px solid var(--red); }
  .dlg-danger:active { background: var(--red-soft, #F3E6D6); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.05a6 6 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12" y2="20"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="18" height="9" rx="2"/><path d="M22 11v3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></symbol>
    <symbol id="i-cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></symbol>
  </defs></svg>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title">회원정보 수정</span>
      <span class="sp"></span>
    </div>

    <div class="scroll">
      <h2 class="lead">회원정보를<br>수정해 주세요</h2>

      <!-- 아이디 (읽기 전용) -->
      <div class="field readonly">
        <label class="lab">아이디</label>
        <div class="box"><span class="val">test4</span><svg class="ic lock"><use href="#i-lock"/></svg></div>
      </div>

      <!-- 비밀번호 (변경 화면 이동) -->
      <div class="field linkrow">
        <label class="lab">비밀번호</label>
        <a class="box" href="#"><span class="pw">••••••••</span><span class="go">변경 <svg class="ic"><use href="#i-cv"/></svg></span></a>
      </div>

      <!-- 이름 -->
      <div class="field">
        <label class="lab" for="f-name">이름</label>
        <div class="box"><input class="inp" id="f-name" type="text" value="김팜" /><button class="clear" aria-label="지우기"><svg class="ic"><use href="#i-x"/></svg></button></div>
      </div>

      <!-- 닉네임 -->
      <div class="field">
        <label class="lab" for="f-nick">닉네임</label>
        <div class="box"><input class="inp" id="f-nick" type="text" value="utii" /><button class="clear" aria-label="지우기"><svg class="ic"><use href="#i-x"/></svg></button></div>
      </div>

      <!-- 이메일 -->
      <div class="field">
        <label class="lab" for="f-email">이메일</label>
        <div class="box"><input class="inp" id="f-email" type="email" value="summertoohotplzstop@gmail.com" /><button class="clear" aria-label="지우기"><svg class="ic"><use href="#i-x"/></svg></button></div>
      </div>

      <!-- 휴대폰 번호 -->
      <div class="field">
        <label class="lab" for="f-phone">휴대폰 번호</label>
        <div class="box"><input class="inp" id="f-phone" type="tel" value="010-0020-3003" /><button class="clear" aria-label="지우기"><svg class="ic"><use href="#i-x"/></svg></button></div>
      </div>

      <p class="help">아이디는 변경할 수 없어요. 비밀번호는 ‘변경’에서 따로 바꿀 수 있어요.</p>
    </div>

    <div class="foot">
      <button class="btn btn-quit" id="btnQuit">회원 탈퇴</button>
      <button class="btn btn-save" id="btnSave">정보 수정</button>
    </div>

    <!-- success toast -->
    <div class="toast-wrap" id="toast">
      <div class="toast" role="status">
        <span class="tic"><svg class="ic"><use href="#i-check"/></svg></span>
        <span class="tt">회원정보가 수정되었어요</span>
      </div>
    </div>

    <!-- withdraw dialog -->
    <div class="scrim" id="quitDialog">
      <div class="dialog" role="alertdialog" aria-labelledby="qdt">
        <div class="dlg-title" id="qdt">정말 탈퇴하시겠어요?</div>
        <div class="dlg-desc">탈퇴하면 회원정보와 그동안의<br>영농일지·진단 기록이 모두 삭제돼요.</div>
        <div class="dlg-actions">
          <button class="dlg-btn dlg-cancel" id="quitCancel">계속 이용하기</button>
          <button class="dlg-btn dlg-danger" id="quitConfirm">탈퇴할게요</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // clear 버튼 동작 (토스식: 입력값 지우기)
    document.querySelectorAll('.clear').forEach(function(btn){
      btn.addEventListener('click', function(){
        var inp = btn.parentElement.querySelector('.inp');
        if (inp) { inp.value = ''; inp.focus(); }
      });
    });

    // 정보 수정 → 성공 토스트
    var toast = document.getElementById('toast');
    var toastTimer;
    document.getElementById('btnSave').addEventListener('click', function(){
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
    });

    // 회원 탈퇴 → 확인 다이얼로그
    var dialog = document.getElementById('quitDialog');
    document.getElementById('btnQuit').addEventListener('click', function(){ dialog.classList.add('show'); });
    document.getElementById('quitCancel').addEventListener('click', function(){ dialog.classList.remove('show'); });
    document.getElementById('quitConfirm').addEventListener('click', function(){ dialog.classList.remove('show'); /* 실제 탈퇴는 개발에서 처리 */ });
    dialog.addEventListener('click', function(e){ if (e.target === dialog) dialog.classList.remove('show'); });
  </script>
</body>
</html>
