<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 로그인</title>
<link rel="stylesheet" href="../_css/common.css"/>
<link rel="stylesheet" href="../_css/components.css"/>
<link rel="stylesheet" href="../_css/login.css"/>
</head>
<body>
  <script src="../_js/sprite.js"></script>
  <div class="phone">
    <div class="bg-motif" aria-hidden="true"><svg class="m1" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg></div>

    <div class="status-bar">
      <span>9:41</span>
      <span class="group"><svg class="ic"><use href="#i-wifi"/></svg> <svg class="ic"><use href="#i-battery"/></svg></span>
    </div>

    <div class="appbar">
      <a class="back" href="../index.html" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></a>
    </div>

    <div class="body">
      <div class="head">
        <div class="logo"><svg class="ic"><use href="#i-leaf"/></svg></div>
        <div class="t">다시 오신 걸 환영해요</div>
        <div class="s">농사친구 계정으로 로그인하세요</div>
      </div>

      <div class="field">
        <div class="box"><input class="inp" type="text" placeholder="아이디" /></div>
      </div>
      <div class="field">
        <div class="box"><input class="inp" type="password" placeholder="비밀번호" /><button class="eye" aria-label="비밀번호 표시"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      </div>

      <a class="btn-login" href="../home.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">로그인</a>

      <div class="links">
        <a href="find-account.html">아이디 찾기</a>
        <span class="sep"></span>
        <a href="find-account.html">비밀번호 찾기</a>
      </div>

      <div class="divider">간편 로그인</div>
      <div class="icon-row">
        <button class="icon-btn kakao" aria-label="카카오 로그인"><svg class="ic"><use href="#i-chat"/></svg></button>
        <button class="icon-btn naver" aria-label="네이버 로그인"><svg class="ic"><use href="#i-naver"/></svg></button>
        <button class="icon-btn apple" aria-label="Apple 로그인"><svg class="ic"><use href="#i-apple"/></svg></button>
        <button class="icon-btn" aria-label="Google 로그인"><svg class="ic"><use href="#i-google"/></svg></button>
      </div>

      <div class="signup-foot">아직 회원이 아니신가요? <a href="signup-terms.html">회원가입</a></div>
    </div>
  </div>

  <script src="../_js/login.js"></script>
</body>
</html>
