<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS팜 — 시작하기</title>
<link rel="stylesheet" href="_css/common.css"/>
<link rel="stylesheet" href="_css/components.css"/>
<link rel="stylesheet" href="_css/index.css"/>
</head>
<body>
  <script src="_js/sprite.js"></script>
  <div class="phone">
    <div class="bg-motif" aria-hidden="true">
      <svg class="m1" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg>
      <svg class="m2" viewBox="0 0 24 24"><use href="#i-leaf-f"/></svg>
    </div>
    <div class="status-bar">
      <span>9:41</span>
      <span class="group">●●●</span>
    </div>

    <div class="body">
      <div class="hero">
        <div class="logo"><svg class="ic"><use href="#i-leaf"/></svg></div>
        <h1 class="headline">농사를 더 쉽게,<br><span class="hl">더 똑똑하게</span></h1>
        <p class="sub">일지 작성, 작물 정보, 대화형 AI까지<br>하나로 관리해 보세요</p>
      </div>

      <div class="auth">
        <a class="btn btn-primary" href="auth/login.html"><span class="bi"><svg class="ic"><use href="#i-mail"/></svg></span>이메일로 시작하기</a>
        <button class="btn btn-kakao"><span class="bi"><svg class="ic"><use href="#i-chat"/></svg></span>카카오로 시작하기</button>

        <div class="divider">간편 로그인</div>

        <div class="icon-row">
          <button class="icon-btn naver" aria-label="네이버로 시작하기"><svg class="ic"><use href="#i-naver"/></svg></button>
          <button class="icon-btn apple" aria-label="Apple로 시작하기"><svg class="ic"><use href="#i-apple"/></svg></button>
          <button class="icon-btn" aria-label="Google로 시작하기"><svg class="ic"><use href="#i-google"/></svg></button>
        </div>

        <div class="foot">이미 계정이 있으신가요? <a href="auth/login.html">로그인</a></div>
      </div>
    </div>
  </div>
</body>
</html>
