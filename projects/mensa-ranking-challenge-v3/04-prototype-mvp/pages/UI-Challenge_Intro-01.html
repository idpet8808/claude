<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI-Challenge_Intro-01 — 챌린지 진입 화면</title>
  <link rel="stylesheet" href="../assets/tokens/colors.css">
  <link rel="stylesheet" href="../assets/tokens/spacing.css">
  <link rel="stylesheet" href="../assets/tokens/typography.css">
  <link rel="stylesheet" href="../assets/css/wireframe.css">
</head>
<body class="wireframe">

  <main class="page-main">

    <header class="page-header-section" data-area="1">
      <span class="area-num">1</span>
      <h1 class="page-title">멘사 랭킹챌린지</h1>
      <p class="page-subtitle"><div class="placeholder input">챌린지 개요 1줄 설명</div></p>
    </header>

    <section class="challenge-intro-section" data-area="2">
      <span class="area-num">2</span>
      <div class="intro-card">
        <div class="intro-item">
          <div class="placeholder input">2-1. 스테이지 구성 안내: "5개의 멘사 오리지널 문제"</div>
        </div>
        <div class="intro-item">
          <div class="placeholder input">2-2. 점수 및 랭킹 안내: 문제점수 + 시간보너스 - 아이템감점</div>
        </div>
        <div class="intro-item">
          <div class="placeholder input">2-3. 아이템 안내: 힌트(3단계) / 패스 사용 방법</div>
        </div>
      </div>
    </section>

    <section class="my-record-section" data-area="3">
      <span class="area-num">3</span>
      <h2 class="section-title">내 기록</h2>
      <div class="record-panel">
        <div class="record-item">
          <label class="record-label">최고 점수</label>
          <div class="placeholder input">3-1. 본인 최고 기록 점수</div>
        </div>
        <div class="record-item">
          <label class="record-label">내 순위 (공식)</label>
          <div class="placeholder input">3-2. 공식 랭킹 내 순위</div>
        </div>
        <div class="record-item">
          <label class="record-label">내 순위 (완주)</label>
          <div class="placeholder input">3-2. 완주 랭킹 내 순위</div>
        </div>
        <div class="record-item">
          <label class="record-label">도전 횟수</label>
          <div class="placeholder input">3-3. 도전 횟수</div>
        </div>
      </div>
    </section>

    <section class="cta-section" data-area="4">
      <span class="area-num">4</span>
      <button class="btn-primary btn-large">챌린지 시작</button>
      <a href="#" class="link-secondary">전체 랭킹 보기</a>
    </section>

  </main>

</body>
</html>
