<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI-Payment_Success-01 — 결제 성공</title>
  <link rel="stylesheet" href="../assets/tokens/colors.css">
  <link rel="stylesheet" href="../assets/tokens/spacing.css">
  <link rel="stylesheet" href="../assets/tokens/typography.css">
  <link rel="stylesheet" href="../assets/css/wireframe.css">
</head>
<body class="wireframe">

  <main class="page-main page-main--centered">

    <section class="success-message-section" data-area="1">
      <span class="area-num">1</span>
      <div class="placeholder large">1-1. 성공 아이콘 (placeholder)</div>
      <h1 class="success-title">1-2. 결제가 완료되었습니다.</h1>
      <div class="placeholder input">1-3. 구매 상품명 + 수량</div>
      <div class="placeholder input">1-4. 아이템 즉시 지급 확인 메시지</div>
    </section>

    <section class="payment-summary-section" data-area="2">
      <span class="area-num">2</span>
      <h2 class="section-title">결제 내역</h2>
      <div class="summary-row">
        <label>결제 금액</label>
        <div class="placeholder input small">2-1. 결제 금액</div>
      </div>
      <div class="summary-row">
        <label>결제 수단</label>
        <div class="placeholder input small">2-2. 결제 수단</div>
      </div>
      <div class="summary-row">
        <label>결제 일시</label>
        <div class="placeholder input small">2-3. YYYY-MM-DD HH:MM</div>
      </div>
    </section>

    <section class="cta-section" data-area="3">
      <span class="area-num">3</span>
      <button class="btn-primary">3-1. 챌린지 계속하기</button>
      <a href="#" class="link-secondary">3-2. 챌린지 홈으로</a>
    </section>

  </main>

</body>
</html>
