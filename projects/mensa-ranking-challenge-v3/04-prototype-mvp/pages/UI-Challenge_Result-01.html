<!-- UI-Challenge_Result-01 / → REQ-RANK-002-01, REQ-RANK-003-01, REQ-RANK-004-01 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI-Challenge_Result-01 — 챌린지 완료 결과</title>
  <link rel="stylesheet" href="../assets/tokens/colors.css">
  <link rel="stylesheet" href="../assets/tokens/spacing.css">
  <link rel="stylesheet" href="../assets/tokens/typography.css">
  <link rel="stylesheet" href="../assets/css/wireframe.css">
</head>
<body class="wireframe">

  <main class="page-main">

    <header class="result-header" data-area="1">
      <span class="area-num">1</span>
      <h1 class="result-title">1-1. 챌린지 완료!</h1>
      <div class="total-score">
        <div class="placeholder input large">1-2. 총 점수 (대형 숫자) — 120점</div>
      </div>
    </header>

    <section class="score-detail-section" data-area="2">
      <span class="area-num">2</span>
      <h2 class="section-title">점수 상세 내역</h2>
      <div class="score-row">
        <div class="placeholder input">2-1. 총 풀이 시간</div>
      </div>
      <div class="score-row">
        <label>문제별 점수 (5개)</label>
        <div class="placeholder large">2-2. Stage 1~5 각각 점수 표시</div>
      </div>
      <div class="score-row">
        <div class="placeholder input">2-3. 시간 보너스 합계</div>
      </div>
      <div class="score-row">
        <div class="placeholder input">2-4. 힌트/패스 사용 감점 내역</div>
      </div>
    </section>

    <section class="ranking-result-section" data-area="3">
      <span class="area-num">3</span>
      <h2 class="section-title">랭킹 결과</h2>
      <div class="ranking-row">
        <label>공식 랭킹 내 내 순위</label>
        <div class="placeholder input">3-1. 공식 랭킹 순위</div>
      </div>
      <div class="ranking-row">
        <label>완주 랭킹 내 내 순위</label>
        <div class="placeholder input">3-2. 완주 랭킹 순위</div>
      </div>
      <a href="#" class="link-secondary">3-3. 내 전체 도전 이력 보기</a>
    </section>

    <section class="cta-section" data-area="4">
      <span class="area-num">4</span>
      <button class="btn-primary">4-1. 재도전</button>
      <a href="#" class="link-secondary">4-2. 전체 랭킹 보기</a>
      <a href="#" class="link-secondary">4-3. 챌린지 홈으로</a>
    </section>

  </main>

</body>
</html>
